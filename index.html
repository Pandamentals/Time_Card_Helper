<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Timecard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-light-180.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<meta name="msapplication-TileColor" content="#1a1a1a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
<title>Timecard Helper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Share Tech Mono', monospace;
    background:
      radial-gradient(circle at 50% 10%, rgba(51,255,51,0.08), transparent 26rem),
      radial-gradient(circle at 20% 80%, rgba(255,170,0,0.08), transparent 18rem),
      linear-gradient(145deg, #32302a 0%, #1c1d1a 52%, #0d120d 100%);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* ── MONITOR SHELL ── */
  .monitor {
    border-radius: 24px;
    padding: 28px 24px 44px;
    width: 100%;
    max-width: 520px;
    position: relative;
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
    isolation: isolate;
  }
  .monitor.theme-tan {
    background: linear-gradient(160deg, #e8e0c8 0%, #d9cfa8 40%, #cfc298 100%);
    box-shadow:
      0 0 0 1px #a89870,
      0 6px 40px rgba(0,0,0,0.7),
      inset 0 1px 0 #f0e8d0,
      inset 0 -2px 0 #b0a080,
      inset 2px 0 0 #ddd0b0,
      inset -2px 0 0 #b8a880;
  }
  .monitor.theme-dark {
    background: linear-gradient(160deg, #2a2a2a 0%, #1e1e1e 40%, #161616 100%);
    box-shadow:
      0 0 0 1px #111,
      0 6px 40px rgba(0,0,0,0.9),
      inset 0 1px 0 #3a3a3a,
      inset 0 -2px 0 #0a0a0a,
      inset 2px 0 0 #2a2a2a,
      inset -2px 0 0 #111;
  }

  .monitor:hover { transform: translateY(-2px); }

  /* vent slits */
  .monitor::after {
    content: '| | | | | | | | | | |';
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 2px;
    pointer-events: none;
    white-space: nowrap;
    transition: color 0.3s;
  }
  .monitor.theme-tan::after { color: #8a7a58; }
  .monitor.theme-dark::after { color: #333; }

  /* green power LED */
  .monitor::before {
    content: '';
    position: absolute;
    bottom: 16px;
    right: 44px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #33ff33;
    box-shadow: 0 0 6px #33ff33, 0 0 12px #33ff3366;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* red LED */
  .led-red {
    position: absolute;
    bottom: 16px;
    right: 28px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #cc1100;
    box-shadow: 0 0 5px #cc1100, 0 0 10px #cc110066;
  }

  /* ── THEME TOGGLE — LED indicator embedded in bezel top-left ── */
  .theme-toggle {
    position: absolute;
    top: 17px;
    left: 20px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    z-index: 20;
    padding: 0;
    transition: box-shadow 0.2s;
  }
  /* sunken socket the LED sits in */
  .theme-toggle::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    z-index: -1;
  }
  .monitor.theme-tan .theme-toggle::before {
    background: radial-gradient(circle, #a89060 0%, #c0aa70 100%);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.5),
      inset 0 -1px 0 rgba(255,255,255,0.15);
  }
  .monitor.theme-dark .theme-toggle::before {
    background: radial-gradient(circle, #111 0%, #1e1e1e 100%);
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.8),
      inset 0 -1px 0 rgba(255,255,255,0.04);
  }
  /* the LED dot itself — amber when tan, green when dark */
  .monitor.theme-tan .theme-toggle {
    background: radial-gradient(circle at 35% 35%, #ffe090, #cc8800);
    box-shadow:
      0 0 4px #cc880088,
      0 0 8px #cc880044,
      inset 0 1px 0 rgba(255,255,200,0.4);
  }
  .monitor.theme-tan .theme-toggle:hover {
    box-shadow:
      0 0 6px #ffaa00cc,
      0 0 12px #cc880066,
      inset 0 1px 0 rgba(255,255,200,0.4);
  }
  .monitor.theme-dark .theme-toggle {
    background: radial-gradient(circle at 35% 35%, #66ff66, #00aa00);
    box-shadow:
      0 0 4px #33ff3399,
      0 0 8px #33ff3344,
      inset 0 1px 0 rgba(200,255,200,0.4);
  }
  .monitor.theme-dark .theme-toggle:hover {
    box-shadow:
      0 0 8px #33ff33cc,
      0 0 14px #33ff3366,
      inset 0 1px 0 rgba(200,255,200,0.4);
  }
  .theme-toggle:active { transform: scale(0.88); }

  /* ── SCREEN ── */
  .screen {
    background: #020e02;
    border-radius: 12px;
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,0.6),
      inset 0 0 20px rgba(51,255,51,0.04),
      0 0 20px rgba(51,255,51,0.08);
    animation: screen-hum 5.5s ease-in-out infinite;
  }
  .screen::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255,255,255,0.025) 0%, transparent 100%);
    border-radius: 12px 12px 60% 60% / 12px 12px 30px 30px;
    pointer-events: none;
    z-index: 10;
  }
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.7),
      inset 0 0 120px rgba(0,0,0,0.58);
    pointer-events: none;
    z-index: 10;
  }

  @keyframes screen-hum {
    0%,100% { box-shadow: inset 0 0 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(51,255,51,0.04), 0 0 20px rgba(51,255,51,0.08); }
    50% { box-shadow: inset 0 0 70px rgba(0,0,0,0.64), inset 0 0 30px rgba(51,255,51,0.08), 0 0 26px rgba(51,255,51,0.12); }
  }

  /* ── SCANLINES ── */
  .scanlines {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px
    );
    border-radius: 12px;
    animation: scanline-roll 9s linear infinite;
  }

  @keyframes scanline-roll {
    from { background-position: 0 0; }
    to { background-position: 0 64px; }
  }

  /* ── FLICKER ── */
  .flicker {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 6;
    background: rgba(51,255,51,0.04);
    mix-blend-mode: screen;
    animation: flicker 8s step-start infinite;
    border-radius: 12px;
  }
  @keyframes flicker {
    0%,100% { opacity: 0; }
    92% { opacity: 0; }
    93% { opacity: 0.03; }
    94% { opacity: 0; }
    97% { opacity: 0.02; }
    98% { opacity: 0; }
  }

  .screen-noise,
  .screen-distortion {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
  }
  .screen-noise {
    z-index: 7;
    opacity: 0.12;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(51,255,51,0.25) 0 1px, transparent 1px);
    background-size: 13px 11px, 17px 19px;
    animation: noise-shift 0.35s steps(2) infinite;
  }
  .screen-distortion {
    z-index: 8;
    opacity: 0.32;
    background:
      linear-gradient(90deg, transparent 0%, rgba(255,68,34,0.09) 12%, transparent 22%),
      linear-gradient(270deg, transparent 0%, rgba(51,255,51,0.08) 18%, transparent 28%);
    filter: blur(0.6px);
    transform: translateX(-100%);
    animation: distortion-pass 6.5s cubic-bezier(0.5,0,0.2,1) infinite;
  }
  @keyframes noise-shift {
    0% { transform: translate3d(0,0,0); }
    100% { transform: translate3d(-2px,1px,0); }
  }
  @keyframes distortion-pass {
    0%, 70%, 100% { transform: translateX(-120%) skewX(0deg); opacity: 0; }
    72% { opacity: 0.12; }
    78% { transform: translateX(15%) skewX(-7deg); opacity: 0.36; }
    84% { transform: translateX(120%) skewX(3deg); opacity: 0; }
  }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 2;
    color: #33ff33;
    text-shadow: 0 0 4px rgba(51,255,51,0.35);
    animation: phosphor-drift 7s ease-in-out infinite;
  }

  /* ── DEGAUSS WOBBLE ── */
  .degauss-anim { animation: degauss 0.65s ease-out; }
  @keyframes degauss {
    0%   { transform: scale(1.025, 0.975) skewX(0deg); filter: brightness(1.2); }
    14%  { transform: scale(0.982, 1.018) skewX(-1.4deg); }
    28%  { transform: scale(1.015, 0.99) skewX(1.1deg); }
    42%  { transform: scale(0.994, 1.008) skewX(-0.7deg); }
    56%  { transform: scale(1.006, 0.996) skewX(0.4deg); }
    70%  { transform: scale(0.998, 1.003) skewX(-0.2deg); }
    85%  { transform: scale(1.002, 0.999) skewX(0.08deg); }
    100% { transform: scale(1,1) skewX(0deg); filter: brightness(1); }
  }

  /* ── TAB SWITCH: the new panel arrives slightly out of focus (soft, faint colour fringing, a hair wide) and pulls into focus ── */
  .tab-resync { animation: tab-resync 0.3s cubic-bezier(0.2, 0.7, 0.25, 1); }
  @keyframes tab-resync {
    0%   { opacity: 0.8; transform: scaleX(1.012); filter: blur(2.2px) brightness(1.18) drop-shadow(2px 0 0 rgba(255, 70, 50, 0.3))  drop-shadow(-2px 0 0 rgba(60, 120, 255, 0.25)); }
    45%  { opacity: 1;   transform: scaleX(1.004); filter: blur(0.9px) brightness(1.08) drop-shadow(0.9px 0 0 rgba(255, 70, 50, 0.14)) drop-shadow(-0.9px 0 0 rgba(60, 120, 255, 0.12)); }
    100% { opacity: 1;   transform: none;          filter: blur(0px)   brightness(1)    drop-shadow(0 0 0 rgba(255, 70, 50, 0))       drop-shadow(0 0 0 rgba(60, 120, 255, 0)); }
  }

  @keyframes phosphor-drift {
    0%,100% { transform: translateX(0); }
    48% { transform: translateX(0); }
    50% { transform: translateX(0.35px); }
    52% { transform: translateX(-0.25px); }
    54% { transform: translateX(0); }
  }

  .header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #33ff3344;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .header-copy { min-width: 0; }
  .sys-line { font-size: 10px; color: #1a8c1a; margin-bottom: 4px; letter-spacing: 1px; }
  h1 { font-family: 'VT323', monospace; font-size: 26px; color: #ffffff; letter-spacing: 3px; text-shadow: 0 0 10px #33ff3399; line-height: 1; }
  .subtitle { font-size: 10px; color: #1a8c1a; margin-top: 4px; letter-spacing: 0.5px; line-height: 1.8; }

  .mascot-panel {
    --mascot-glow: #33ff33;
    --mascot-dim: #1a8c1a;
    --mascot-core: #dfff33;
    --mascot-shade: #061406;
    --tic-size: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    width: 76px;
    margin: -2px 0 -2px;
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .time-mascot {
    width: var(--tic-size);
    height: var(--tic-size);
    display: block;
    overflow: visible;
    color: var(--mascot-glow);
    filter:
      drop-shadow(0 0 4px color-mix(in srgb, var(--mascot-glow) 70%, transparent))
      drop-shadow(0 0 11px color-mix(in srgb, var(--mascot-glow) 30%, transparent));
    animation:
      mascot-idle 2.8s ease-in-out infinite,
      mascot-breathe 3.4s ease-in-out infinite;
    transition: color 0.35s, filter 0.35s;
  }
  .mascot-line,
  .mascot-fill,
  .mascot-face,
  .mascot-detail {
    stroke: currentColor;
    transition: stroke 0.35s, fill 0.35s, opacity 0.25s, transform 0.25s;
  }
  .mascot-line {
    fill: var(--mascot-shade);
    stroke-width: 4.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mascot-fill { fill: var(--mascot-core); stroke-width: 2; }
  .mascot-face {
    fill: none;
    stroke-width: 4.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mascot-detail {
    fill: none;
    stroke-width: 2.1;
    stroke-linecap: round;
    opacity: 0.68;
  }
  .mascot-black { fill: #020e02; stroke: none; }
  .mascot-grain { fill: currentColor; opacity: 0.38; transform-box: fill-box; transform-origin: center; }
  .mascot-rim { fill: none; stroke-width: 3; opacity: 0.85; }
  .mascot-eye { transform-origin: center; }
  .mascot-mouth {
    opacity: 0;
    stroke-width: 4.1;
    transform-box: fill-box;
    transform-origin: center;
  }
  .mascot-brow {
    fill: var(--mascot-core);
    stroke: none;
    opacity: 0.9;
    transform-box: fill-box;
    transform-origin: center;
  }
  .mascot-hand,
  .mascot-foot,
  .mascot-leg,
  .mascot-arm,
  .mascot-bell { transform-box: fill-box; transform-origin: center; }
  .mascot-status-good {
    --mascot-glow: #bfff24;
    --mascot-dim: #8fb81f;
    --mascot-core: #dfff33;
  }
  .mascot-status-worried {
    --mascot-glow: #ffe033;
    --mascot-dim: #b89420;
    --mascot-core: #ffe85a;
  }
  .mascot-status-stressed {
    --mascot-glow: #ff8a22;
    --mascot-dim: #c05718;
    --mascot-core: #ff9e38;
  }
  .mascot-status-meltdown {
    --mascot-glow: #ff3322;
    --mascot-dim: #b51f18;
    --mascot-core: #ff513d;
  }
  .mascot-status-over-mild {
    --mascot-glow: #ffcc33;
    --mascot-dim: #b8901f;
    --mascot-core: #ffe070;
  }
  .mascot-status-over-high {
    --mascot-glow: #ffaa00;
    --mascot-dim: #c07d00;
    --mascot-core: #ffc133;
  }
  .mascot-status-over-extreme {
    --mascot-glow: #ff8800;
    --mascot-dim: #c06200;
    --mascot-core: #ffa033;
  }
  .mascot-status-good .mouth-happy,
  .mascot-status-worried .mouth-worried,
  .mascot-status-stressed .mouth-stressed,
  .mascot-status-meltdown .mouth-meltdown,
  .mascot-status-over-mild .mouth-over,
  .mascot-status-over-high .mouth-over,
  .mascot-status-over-extreme .mouth-over { opacity: 1; }
  .mascot-status-good .mascot-eye { transform: translateY(1px) scaleX(1.04); }
  .mascot-status-worried .mascot-eye { transform: translateY(-0.5px) scaleY(1.08); }
  .mascot-status-stressed .mascot-eye { transform: translateY(-1px) scaleX(0.84) scaleY(1.18); }
  .mascot-status-meltdown .mascot-eye { transform: translateY(-1.5px) scaleX(0.72) scaleY(1.28); }
  .mascot-status-over-mild .mascot-eye,
  .mascot-status-over-high .mascot-eye,
  .mascot-status-over-extreme .mascot-eye { transform: translateY(1.5px) scaleX(1.06) scaleY(0.9); }
  .mascot-status-good .brow-left { transform: translate(-1px,1px) rotate(-5deg); }
  .mascot-status-good .brow-right { transform: translate(1px,1px) rotate(5deg); }
  .mascot-status-worried .brow-left { transform: translate(1px,2px) rotate(-8deg); }
  .mascot-status-worried .brow-right { transform: translate(-1px,2px) rotate(8deg); }
  .mascot-status-stressed .brow-left { transform: translate(2px,3px) rotate(-13deg); }
  .mascot-status-stressed .brow-right { transform: translate(-2px,3px) rotate(13deg); }
  .mascot-status-meltdown .brow-left { transform: translate(3px,4px) rotate(-18deg); }
  .mascot-status-meltdown .brow-right { transform: translate(-3px,4px) rotate(18deg); }
  .mascot-status-over-mild .brow-left,
  .mascot-status-over-high .brow-left,
  .mascot-status-over-extreme .brow-left { transform: translate(-1px,0px) rotate(-4deg); }
  .mascot-status-over-mild .brow-right,
  .mascot-status-over-high .brow-right,
  .mascot-status-over-extreme .brow-right { transform: translate(1px,0px) rotate(4deg); }
  .mascot-status-worried .time-mascot {
    animation:
      mascot-worry 1.9s ease-in-out infinite,
      mascot-breathe 3.4s ease-in-out infinite;
  }
  .mascot-status-stressed .time-mascot {
    animation:
      mascot-stress 0.5s steps(2) infinite,
      mascot-breathe 3.4s ease-in-out infinite;
  }
  .mascot-status-meltdown .time-mascot {
    animation:
      mascot-meltdown 0.22s steps(2) infinite,
      mascot-breathe 3.4s ease-in-out infinite;
  }
  .mascot-status-over-high .time-mascot,
  .mascot-status-over-extreme .time-mascot {
    animation:
      mascot-idle 2.2s ease-in-out infinite,
      mascot-breathe 2.6s ease-in-out infinite;
  }
  .mascot-status-worried .mascot-hand { animation: hand-worry 1.4s ease-in-out infinite; }
  .mascot-status-stressed .mascot-hand,
  .mascot-status-meltdown .mascot-hand { animation: hand-tremble 0.32s steps(2) infinite; }
  .mascot-status-stressed .mascot-grain,
  .mascot-status-meltdown .mascot-grain { animation: grain-fizz 0.45s steps(2) infinite; }
  .mascot-status-meltdown .mascot-bell { animation: bell-rattle 0.18s steps(2) infinite; }
  .mascot-copy {
    width: 100%;
    min-width: 0;
    font-size: 8px;
    line-height: 1.25;
    color: var(--mascot-dim);
    letter-spacing: 0.5px;
    text-align: center;
    transition: color 0.35s;
  }
  #mascotLineB { display: none; }
  @keyframes mascot-idle {
    0%,100% { transform: translateY(0) rotate(-0.5deg); }
    50% { transform: translateY(-3px) rotate(0.5deg); }
  }
  @keyframes mascot-breathe {
    0%,100% {
      filter:
        drop-shadow(0 0 3px color-mix(in srgb, var(--mascot-glow) 52%, transparent))
        drop-shadow(0 0 8px color-mix(in srgb, var(--mascot-glow) 22%, transparent));
    }
    50% {
      filter:
        drop-shadow(0 0 5px color-mix(in srgb, var(--mascot-glow) 70%, transparent))
        drop-shadow(0 0 13px color-mix(in srgb, var(--mascot-glow) 34%, transparent));
    }
  }
  @keyframes mascot-worry {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-2px) rotate(1.5deg); }
  }
  @keyframes mascot-stress {
    0%,100% { transform: translate(0,0) rotate(-1deg); }
    50% { transform: translate(1px,-1px) rotate(1deg); }
  }
  @keyframes mascot-meltdown {
    0%,100% { transform: translate(-1px,0) rotate(-2deg) scaleY(1); }
    50% { transform: translate(1px,1px) rotate(2deg) scaleY(0.98); }
  }
  @keyframes hand-worry {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(2px) rotate(-5deg); }
  }
  @keyframes hand-tremble {
    0%,100% { transform: translateX(0) rotate(0deg); }
    50% { transform: translateX(2px) rotate(5deg); }
  }
  @keyframes bell-rattle {
    0%,100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  @keyframes grain-fizz {
    0%,100% { opacity: 0.22; transform: translate(0,0); }
    50% { opacity: 0.48; transform: translate(1px,-1px); }
  }

  /* ── HOLIDAY BANNER ── */
  #holiday-banner {
    display: none;
    margin-bottom: 10px;
    border: 1px solid #33ff3344;
    border-left: 2px solid #33ff33;
    background: rgba(0,30,0,0.7);
    padding: 7px 11px;
  }
  #holiday-banner.active { display: block; }
  .banner-line {
    font-size: 10px;
    color: #33ff33;
    letter-spacing: 0.5px;
    line-height: 2.2;
  }
  .banner-line::before { content: '⚑ '; }

  /* ── DAY CARDS ── */
  .day-card {
    border: 1px solid #164416;
    border-left: 2px solid #249724;
    padding: 9px 11px;
    margin-bottom: 7px;
    background: rgba(0,18,0,0.42);
    transition: opacity 0.2s, border-left-color 0.2s;
  }
  .day-card.is-holiday {
    border-left-color: #1a5c1a;
    opacity: 0.65;
  }

  .day-top {
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .day-name { font-family: 'VT323', monospace; font-size: 19px; color: #33ff33; letter-spacing: 2px; text-shadow: 0 0 4px #33ff3355; }

  .day-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

  .hol-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 3px 7px;
    border: 1px solid #267326;
    background: #000;
    color: #267326;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .hol-btn:hover { border-color: #33ff3344; color: #33ff3366; }
  .hol-btn.active { background: #001200; border-color: #267326; color: #2a8c2a; box-shadow: 0 0 4px #33ff3311; }

  .holiday-display {
    display: none;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #1a6c1a;
    letter-spacing: 2px;
    padding: 7px 0 5px;
    text-align: center;
    border: 1px dashed #1a5c1a55;
    background: rgba(0,10,0,0.5);
    margin-bottom: 2px;
  }

  .times-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 9px; }
  .time-group { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .time-label { font-size: 9px; color: #1a8c1a; letter-spacing: 1px; text-transform: uppercase; }

  input[type=time] {
    font-family: 'VT323', monospace;
    font-size: 19px;
    padding: 3px 6px;
    border: 1px solid #1a5c1a;
    width: 100%;
    min-width: 0;
    overflow: hidden;
    background: #000;
    color: #33ff33;
    outline: none;
    letter-spacing: 1px;
    text-shadow: 0 0 4px #33ff3366;
  }
  input[type=time]:focus { border-color: #33ff33; box-shadow: 0 0 6px #33ff3344; }
  input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(1) saturate(3) hue-rotate(80deg); opacity: 0.35; }

  /* shrink clock icon on mobile so AM/PM stays visible — applies to real mobile AND sim toggle */
  @media (max-width: 767px) {
    input[type=time]::-webkit-calendar-picker-indicator {
      width: 12px;
      height: 12px;
      padding: 0;
      margin-left: 2px;
    }
  }

  .bottom-row { display: flex; align-items: center; justify-content: space-between; }
  .lunch-label { font-size: 9px; color: #1a8c1a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .lunch-btns { display: flex; gap: 4px; }
  .lunch-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; padding: 4px 8px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #1a8c1a;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .lunch-btn.active { background: #001a00; border-color: #249724; color: #33ff33; box-shadow: 0 0 3px #33ff331f; }
  .lunch-btn:hover  { border-color: #33ff3355; color: #33ff3377; }

  .hours-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .hours-label { font-size: 9px; color: #1a8c1a; letter-spacing: 1px; text-transform: uppercase; }
  .pill { font-family: 'VT323', monospace; font-size: 19px; padding: 1px 9px; letter-spacing: 1px; border: 1px solid; }
  .pill-ok    { color: #ffffff; border-color: #ffffff55; text-shadow: 0 0 6px #fff; background: #001a00; }
  .pill-short { color: #ff4422; border-color: #ff442255; text-shadow: 0 0 6px #ff4422; background: #130000; }
  .pill-over  { color: #ffaa00; border-color: #ffaa0055; text-shadow: 0 0 6px #ffaa00; background: #140d00; }
  .pill-none  { color: #1a5c1a; border-color: #0f2e0f; background: #000; }
  .pill-hol   { color: #1a6c1a; border-color: #1a5c1a44; background: #000; }
  .pill-pto   { color: #cc9900; border-color: #cc990055; text-shadow: 0 0 5px #cc990088; background: #0a0800; }

  .pto-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 3px 7px;
    border: 1px solid #7d5200;
    background: #000;
    color: #7d5200;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .pto-btn:hover { border-color: #cc990044; color: #cc990066; }
  .pto-btn.active { background: #0a0800; border-color: #886600; color: #cc9900; box-shadow: 0 0 4px #cc990022; }

  .pto-display {
    display: none;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #886600;
    letter-spacing: 2px;
    padding: 7px 0 5px;
    text-align: center;
    border: 1px dashed #66440055;
    background: rgba(10,8,0,0.5);
    margin-bottom: 2px;
  }

  .day-card.is-pto {
    border-left-color: #886600;
    opacity: 0.65;
  }

  /* ── AWAY BLOCK ── */
  .away-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 3px 7px;
    border: 1px solid #005f8c;
    background: #000;
    color: #005f8c;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .away-btn:hover { border-color: #0088cc44; color: #0088cc66; }
  .away-btn.active { background: #00080d; border-color: #006699; color: #0099cc; box-shadow: 0 0 4px #0099cc22; }

  .away-block {
    display: none;
    margin-bottom: 7px;
    padding: 7px 9px;
    border: 1px dashed #00446655;
    background: rgba(0,8,16,0.6);
  }
  .away-block.visible { display: block; }

  .away-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .away-title {
    font-size: 9px;
    color: #006699;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .away-clear {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 1px 5px;
    border: 1px solid #440000;
    background: #000;
    color: #660000;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .away-clear:hover { border-color: #ff442244; color: #ff442266; }

  .away-times { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

  .pill-inner { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .pill-sub { font-size: 11px; color: #0099cc; opacity: 0.85; letter-spacing: 0.5px; margin-top: 1px; }

  .divider { border: none; border-top: 1px solid #1a5c1a; margin: 0.9rem 0; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 0.8rem; }
  .metric { background: rgba(0,18,0,0.42); border: 1px solid #164416; border-top: 2px solid #249724; padding: 8px 9px; }
  .metric-label { font-size: 9px; color: #1a8c1a; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
  .metric-value { font-family: 'VT323', monospace; font-size: 21px; color: #33ff33; text-shadow: 0 0 5px #33ff3366; letter-spacing: 1px; }
  .metric-value.good { color: #ffffff; text-shadow: 0 0 8px #ffffffaa; }
  .metric-value.bad-short { color: #ff4422; text-shadow: 0 0 8px #ff442299; }
  .metric-value.bad-over  { color: #ffaa00; text-shadow: 0 0 8px #ffaa0099; }
  .metric-sub { font-size: 9px; color: #1a8c1a; margin-top: 2px; letter-spacing: 0.5px; }

  .advice {
    font-size: 10px;
    padding: 9px 11px;
    border: 1px solid #1a5c1a;
    border-left: 2px solid #33ff33;
    background: rgba(0,20,0,0.5);
    line-height: 2;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .prompt { color: #33ff33; }
  .advice-text { color: #33ff33; }
  .advice-text.warn-short { color: #ff4422; }
  .advice-text.warn-over  { color: #ffaa00; }
  .advice-text.good { color: #ffffff; }

  /* ── RESET ── */
  .reset-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .reset-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 6px 14px;
    border: 1px solid #ff4422;
    background: #000;
    color: #ff4422;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.15s;
    box-shadow: 0 0 6px #ff442244, 0 0 12px #ff442211;
  }
  .reset-btn:hover { box-shadow: 0 0 10px #ff442266, 0 0 20px #ff442222; }
  @keyframes red-pulse {
    0%,100% { box-shadow: 0 0 8px #ff442266, 0 0 16px #ff442233; }
    50%      { box-shadow: 0 0 16px #ff4422cc, 0 0 32px #ff442266, inset 0 0 8px #ff442122; }
  }
  .reset-btn.confirming {
    border-color: #ff4422;
    color: #ff4422;
    animation: red-pulse 1.2s ease-in-out infinite;
  }

  .confirm-btns { display: none; gap: 6px; }
  .confirm-btns.visible { display: flex; }
  @keyframes green-pulse {
    0%,100% { box-shadow: 0 0 6px #33ff3355, 0 0 12px #33ff3322; }
    50%      { box-shadow: 0 0 12px #33ff33aa, 0 0 24px #33ff3355; }
  }
  .confirm-yes, .confirm-no {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 6px 12px;
    border: 1px solid;
    background: #000;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.15s;
  }
  .confirm-yes { border-color: #ff4422; color: #ff4422; animation: red-pulse 1.2s ease-in-out infinite; }
  .confirm-yes:hover { background: #130000; }
  .confirm-no  { border-color: #33ff33; color: #33ff33; animation: green-pulse 1.2s ease-in-out infinite; }
  .confirm-no:hover  { background: #001a00; }

  /* ── BOOT SCREEN ── */
  #boot-overlay {
    position: absolute;
    inset: 0;
    background: #020e02;
    border-radius: 12px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px 18px;
    overflow: hidden;
  }
  #boot-overlay.hidden { display: none; }
  #boot-overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px
    );
    border-radius: 12px;
    pointer-events: none;
    z-index: 5;
  }
  #boot-overlay::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 4;
    opacity: 0;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,0.92) 0%, rgba(51,255,51,0.62) 7%, rgba(51,255,51,0.12) 20%, transparent 44%),
      linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: scaleY(0.035);
    animation: boot-tube-flash 0.68s cubic-bezier(0.2,0,0.1,1) forwards;
  }
  @keyframes boot-tube-flash {
    0% { opacity: 0; transform: scaleY(0.01) scaleX(0.2); filter: brightness(2); }
    18% { opacity: 1; transform: scaleY(0.025) scaleX(1); filter: brightness(4); }
    42% { opacity: 0.65; transform: scaleY(1.08) scaleX(1); filter: brightness(1.8); }
    100% { opacity: 0; transform: scaleY(1.08) scaleX(1); filter: brightness(1); }
  }
  .boot-lines { position: relative; z-index: 6; }
  .boot-line {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #1a8c1a;
    letter-spacing: 0.5px;
    line-height: 2.2;
    opacity: 0;
    white-space: nowrap;
    overflow: hidden;
  }
  .boot-line.visible { opacity: 1; }
  .boot-line .ok   { color: #33ff33; text-shadow: 0 0 6px #33ff3366; }
  .boot-line-title {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #ffffff;
    letter-spacing: 3px;
    text-shadow: 0 0 10px #33ff3399;
    opacity: 0;
    margin-top: 6px;
    line-height: 1.3;
  }
  .boot-line-title.visible { opacity: 1; }
  .boot-cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: #33ff33;
    box-shadow: 0 0 6px #33ff33;
    vertical-align: middle;
    margin-left: 2px;
    animation: blink-cursor 0.7s step-start infinite;
  }
  @keyframes blink-cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── THEME-SWITCH BLINK (soft flicker, layered on top of the bezel crossfade) ── */
  #theme-flash {
    position: absolute;
    inset: 0;
    background: rgba(2,14,2,0.55);
    border-radius: 12px;
    z-index: 99;
    pointer-events: none;
    opacity: 0;
  }
  #theme-flash.flashing { animation: theme-blink 0.22s ease-out; }
  @keyframes theme-blink {
    0%   { opacity: 0; }
    30%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes crt-collapse {
    0%   { transform: scaleY(1);    filter: brightness(1); }
    70%  { transform: scaleY(0.06); filter: brightness(2.5); }
    100% { transform: scaleY(0.02); filter: brightness(4); }
  }
  #boot-overlay.booting-out {
    transform-origin: center center;
    animation: crt-collapse 0.28s cubic-bezier(0.4,0,1,1) forwards;
  }
  @keyframes screen-bloom {
    0%   { filter: brightness(1)  saturate(1);   }
    20%  { filter: brightness(4)  saturate(0.3); }
    45%  { filter: brightness(6)  saturate(0.1); }
    100% { filter: brightness(1)  saturate(1);   }
  }
  .screen.blooming { animation: screen-bloom 0.9s ease-out forwards; }

  .content.boot-hidden { opacity: 0; }
  @keyframes content-fadein {
    0%   { opacity: 0; filter: brightness(2) saturate(0.3); }
    100% { opacity: 1; filter: brightness(1) saturate(1);   }
  }
  .content.boot-reveal { animation: content-fadein 0.35s ease-out forwards; }

  /* ── BOOT SCANLINE BEAM ── */
  #boot-scanline {
    position: absolute;
    left: -2px; right: -2px;
    height: 32px;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    top: -32px;
    background: linear-gradient(
      180deg,
      transparent              0%,
      rgba(51,255,51,0.06)     12%,
      rgba(51,255,51,0.18)     35%,
      rgba(180,255,180,0.65)   50%,
      rgba(51,255,51,0.18)     65%,
      rgba(51,255,51,0.06)     88%,
      transparent              100%
    );
    box-shadow: 0 0 10px 3px rgba(51,255,51,0.35), 0 0 28px 6px rgba(51,255,51,0.15);
    filter: blur(0.3px);
  }
  #boot-scanline.sweeping { opacity: 1; }

  /* ── DESKTOP ── */
  @media (min-width: 768px) {
    body { padding: 3rem 2rem; align-items: center; }
    .monitor { max-width: 720px; padding: 34px 30px 52px; }
    h1 { font-size: 32px; }
    .sys-line, .subtitle { font-size: 11px; }
    .screen { padding: 24px 22px; }
    #rows {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 9px;
    }
    .day-card { margin-bottom: 0; }
    /* Mon=col1-2, Tue=col3-4, Wed=col1-2, Thu=col3-4, Fri=col2-3 (centered) */
    .day-card:nth-child(1) { grid-column: 1 / 3; }
    .day-card:nth-child(2) { grid-column: 3 / 5; }
    .day-card:nth-child(3) { grid-column: 1 / 3; }
    .day-card:nth-child(4) { grid-column: 3 / 5; }
    .day-card:nth-child(5) { grid-column: 2 / 4; }
    .day-name { font-size: 22px; }
    input[type=time] { font-size: 22px; }
    .pill { font-size: 22px; padding: 2px 12px; }
    .pill-sub { font-size: 12px; }
    .metric-value { font-size: 24px; }
    .banner-line { font-size: 11px; }
    .advice { font-size: 11px; }
    .reset-btn, .confirm-yes, .confirm-no { font-size: 11px; padding: 7px 16px; }
  }

  @media (max-width: 430px) {
    body { padding: 1rem 0.5rem; }
    .monitor { padding: 24px 14px 42px; border-radius: 20px; }
    .screen { padding: 18px 14px; }
    .theme-toggle { left: 5px; top: 12px; }
    .mascot-panel { width: 52px; margin: -2px 0; }
    .mascot-copy { display: none; }
    .time-mascot { width: 44px; height: 44px; }
    .summary { gap: 5px; }
    .metric { padding: 7px 6px; }
    .metric-label { font-size: 8px; }
    .metric-value { font-size: 18px; }
  }

  /* ── TABS ── */
  [hidden] { display: none !important; }
  .tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab {
    font-family: 'VT323', monospace;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 2px 12px 1px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #1a8c1a;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { border-color: #33ff3355; color: #33ff3399; }
  .tab[aria-selected="true"] {
    background: #001a00;
    border-color: #33ff33;
    color: #33ff33;
    text-shadow: 0 0 6px #33ff3388;
    box-shadow: 0 0 6px #33ff3333, inset 0 0 6px #33ff3311;
  }
  .tab:focus-visible { outline: 1px solid #33ff33; outline-offset: 2px; }
  .week-label { margin-left: auto; font-size: 10px; color: #1a8c1a; letter-spacing: 1px; }

  /* ── TIMECARD: week dates, planner-driven states ── */
  .day-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .day-date { font-size: 9px; color: #1a8c1a; letter-spacing: 1px; }
  .day-card.is-today { border-left-color: #33ff33; box-shadow: 0 0 8px #33ff3318; }
  .day-card.is-today .day-date::before { content: '▸ TODAY · '; color: #33ff33; }
  .off-display {
    display: none;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: #0077aa;
    letter-spacing: 2px;
    padding: 7px 0 5px;
    text-align: center;
    border: 1px dashed #00446655;
    background: rgba(0,8,16,0.5);
    margin-bottom: 2px;
  }
  .day-card.is-off { border-left-color: #006699; opacity: 0.65; }
  .pill-off { color: #0099cc; border-color: #0099cc55; text-shadow: 0 0 5px #0099cc88; background: #00080d; }

  #week-prompt {
    display: none;
    margin-bottom: 10px;
    border: 1px solid #cc990055;
    border-left: 2px solid #ffaa00;
    background: rgba(10,8,0,0.7);
    padding: 7px 11px;
  }
  #week-prompt.active { display: block; }
  .wp-text { font-size: 10px; color: #ffaa00; letter-spacing: 0.5px; line-height: 2; }
  .wp-text::before { content: '⚑ '; }
  .wp-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .wp-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 5px 10px;
    border: 1px solid #cc9900;
    background: #000;
    color: #ffaa00;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .wp-btn:hover { background: #0a0800; box-shadow: 0 0 6px #cc990044; }
  .wp-btn.keep { border-color: #1a5c1a; color: #33ff33; }
  .wp-btn.keep:hover { background: #001a00; box-shadow: 0 0 6px #33ff3333; }

  /* ── PTO PLANNER ── */
  #view-pto { display: flex; flex-direction: column; gap: 12px; }
  .p-title { font-family: 'VT323', monospace; font-size: 22px; color: #fff; letter-spacing: 3px; text-shadow: 0 0 8px #33ff3399; line-height: 1; }
  .p-sub { font-size: 10px; color: #1a8c1a; letter-spacing: 0.5px; line-height: 1.8; margin-top: 3px; }

  .p-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  @media (min-width: 480px) { .p-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .p-stat { background: rgba(0,18,0,0.42); border: 1px solid #164416; border-top: 2px solid #249724; padding: 8px 9px; min-width: 0; }
  .p-stat .k { display: block; font-size: 9px; color: #1a8c1a; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }

  .p-stat .n { display: block; font-size: 9px; color: #1a8c1a; margin-top: 3px; line-height: 1.5; letter-spacing: 0.5px; }
  .p-tile-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    margin-top: 5px;
    padding: 2px 6px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #1a8c1a;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .p-tile-btn:hover { border-color: #33ff3377; color: #33ff33; }
  .p-tile-btn:focus-visible { outline: 1px solid #33ff33; outline-offset: 2px; }
  .p-stat.warn { border-top-color: #cc9900; }
  .p-stat.warn .v { color: #ffaa00; text-shadow: 0 0 8px #ffaa0099; }
  .p-stat.bad { border-top-color: #ff4422; background: rgba(19,0,0,0.6); }
  .p-stat.bad .v { color: #ff4422; text-shadow: 0 0 8px #ff442299; }

  .p-legend { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 9px; color: #1a8c1a; letter-spacing: 1px; text-transform: uppercase; }
  .p-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .p-sw { width: 10px; height: 10px; display: inline-block; border: 1px solid; }


  .p-month { border: 1px solid #164416; border-left: 2px solid #249724; background: rgba(0,18,0,0.42); padding: 9px 10px 10px; }
  .p-mb { font-size: 10px; color: #1a8c1a; letter-spacing: 0.5px; white-space: nowrap; }
  .p-mbline { margin-bottom: 7px; text-align: right; }
  .p-mb.neg { color: #ff4422; text-shadow: 0 0 5px #ff442255; }
  .p-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }

  .p-subtabs { display: flex; gap: 6px; }
  .p-subtab {
    flex: 1; font-family: 'VT323', monospace; font-size: 19px; letter-spacing: 2px; padding: 3px 4px;
    border: 1px solid #1a5c1a; background: #000; color: #1a8c1a; cursor: pointer; transition: all 0.15s;
  }
  .p-subtab:hover { border-color: #33ff3355; color: #33ff3399; }
  .p-subtab[aria-selected="true"] { border-color: #33ff33; color: #33ff33; background: #001a00; box-shadow: 0 0 6px #33ff3333; text-shadow: 0 0 6px #33ff3388; }
  .p-subtab:focus-visible { outline: 1px solid #33ff33; outline-offset: 2px; }

  .p-pager { display: flex; gap: 6px; align-items: center; }
  .p-arrow { font-family: 'VT323', monospace; font-size: 26px; line-height: 1; padding: 0 14px 3px; border: 1px solid #1a5c1a; background: #000; color: #33ff33; cursor: pointer; }
  .p-arrow:hover:not(:disabled) { border-color: #33ff3377; background: #001a00; }
  .p-arrow:disabled { color: #0f3d0f; border-color: #0f2e0f; cursor: default; }
  .p-arrow:focus-visible, .p-mtoggle:focus-visible, .p-mitem:focus-visible { outline: 1px solid #33ff33; outline-offset: 2px; }
  .p-pname { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'VT323', monospace; font-size: 24px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 8px #33ff3399; white-space: nowrap; }
  .p-mtoggle { font-family: 'Share Tech Mono', monospace; font-size: 11px; line-height: 1; padding: 5px 7px; border: 1px solid #1a5c1a; background: #000; color: #33ff33; text-shadow: none; cursor: pointer; flex: none; }
  .p-mtoggle:hover, .p-mtoggle[aria-expanded="true"] { border-color: #33ff33; background: #001a00; box-shadow: 0 0 6px #33ff3333; }
  .p-mlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 6px; border: 1px solid #164416; border-left: 2px solid #33ff33; background: rgba(0,18,0,0.7); }
  .p-mitem { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 7px 8px; border: 1px solid #0f2e0f; background: #000; color: #33ff33; font-family: 'VT323', monospace; font-size: 18px; letter-spacing: 1px; cursor: pointer; text-align: left; min-width: 0; }
  .p-mitem b { font-family: 'Share Tech Mono', monospace; font-weight: normal; font-size: 10px; letter-spacing: 0; color: #1a8c1a; white-space: nowrap; }
  .p-mitem b em { font-style: normal; color: #ff4422; text-shadow: 0 0 5px #ff442266; }
  .p-mitem b.neg { color: #ff4422; text-shadow: 0 0 5px #ff442255; }
  .p-mitem:hover { border-color: #33ff3366; }
  .p-mitem.now span { text-decoration: underline; text-underline-offset: 2px; }
  .p-mitem.sel { border-color: #33ff33; background: #001a00; box-shadow: 0 0 6px #33ff3333; }
  .p-mitem.p-mnow { grid-column: 1 / -1; border-color: #cc9900; color: #ffaa00; }
  .p-mitem.p-mnow b { color: #886600; }
  .p-dow { font-size: 9px; color: #1a8c1a; text-align: center; letter-spacing: 1px; padding-bottom: 2px; }
  .p-day {
    position: relative;
    min-height: 52px;
    border: 1px solid #0f2e0f;
    background: rgba(0,0,0,0.55);
    color: #33ff33;
    padding: 3px 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font: inherit;
    text-align: left;
    cursor: pointer;
    min-width: 0;
    transition: border-color 0.15s;
  }
  button.p-day:hover { border-color: #33ff3366; }
  button.p-day:focus-visible { outline: 1px solid #33ff33; outline-offset: 1px; }
  .p-day.empty { border: none; background: transparent; cursor: default; }
  .p-day.wk { background: rgba(0,10,0,0.3); border: 1px dashed #0f2e0f; cursor: default; color: #1a5c1a; }
  .p-dn { font-family: 'VT323', monospace; font-size: 17px; line-height: 1; }
  .p-tag { font-size: 10px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px; }
  .p-bal { font-size: 9px; color: #1a8c1a; line-height: 1; letter-spacing: 0.3px; }
  .p-day.pto { background: #0a0800; border-color: #886600; }
  .p-day.pto .p-tag { color: #ffaa00; text-shadow: 0 0 5px #ffaa0088; }
  .p-day.pto .p-bal { color: #886600; }
  .p-day.hol { background: #002a00; border-color: #33ff3388; }
  .p-day.hol .p-tag { color: #33ff33; text-shadow: 0 0 5px #33ff3388; }
  .p-day.holoff .p-tag { color: #1a8c1a; text-decoration: line-through; }
  .p-day.shut { background: #00080d; border: 1px dashed #0099cc; }
  .p-day.shut .p-tag { color: #0099cc; text-shadow: 0 0 5px #0099cc88; }
  .p-day.neg { box-shadow: inset 0 0 0 1px #ff4422, 0 0 6px #ff442244; }
  .p-day.neg .p-bal { color: #ff4422; }
  .p-day.today .p-dn { color: #fff; text-shadow: 0 0 6px #fff; text-decoration: underline; text-underline-offset: 2px; }
  .p-pay { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px #fff; }
  .p-cap { position: absolute; top: 3px; right: 4px; font-size: 8px; color: #ffaa00; text-shadow: 0 0 5px #ffaa0088; letter-spacing: 0.5px; }

  .p-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
  .p-form label { display: flex; flex-direction: column; gap: 3px; font-size: 9px; color: #1a8c1a; letter-spacing: 1px; text-transform: uppercase; min-width: 0; }
  .p-form input, .p-custom input {
    font-family: 'VT323', monospace;
    font-size: 19px;
    letter-spacing: 1px;
    padding: 3px 6px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #33ff33;
    text-shadow: 0 0 4px #33ff3366;
    outline: none;
    width: 100%;
    min-width: 0;
  }
  .p-form input:focus, .p-custom input:focus { border-color: #33ff33; box-shadow: 0 0 6px #33ff3344; }
  .p-form input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(1) saturate(3) hue-rotate(80deg); opacity: 0.35; }
  .p-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .p-panel { border: 1px solid #164416; border-left: 2px solid #249724; background: rgba(0,18,0,0.42); padding: 10px 11px; }
  .p-pending { border-left-color: #ffaa00; background: rgba(10,8,0,0.7); }
  .p-subhead { font-family: 'VT323', monospace; font-size: 19px; letter-spacing: 2px; color: #33ff33; margin-bottom: 4px; }
  .p-pending .p-subhead { color: #ffaa00; }
  .p-sync { margin-top: 14px; padding-top: 10px; border-top: 1px dashed #164416; }
  .p-lbl { display: block; font-size: 9px; color: #1a8c1a; letter-spacing: 1px; margin: 10px 0 3px; }
  .p-code {
    display: block;
    width: 100%;
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    line-height: 1.4;
    word-break: break-all;
    padding: 6px 8px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #33ff33;
    outline: none;
    resize: vertical;
  }
  .p-code:focus { border-color: #33ff33; box-shadow: 0 0 6px #33ff3344; }
  .p-err { min-height: 1em; margin-top: 6px; font-size: 10px; letter-spacing: 0.5px; color: #ff4422; text-shadow: 0 0 5px #ff442266; }
  .p-note { font-size: 9px; color: #1a8c1a; letter-spacing: 0.5px; line-height: 1.8; margin-top: 8px; }

  .p-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 7px 10px;
    border: 1px solid #1a5c1a;
    background: #000;
    color: #33ff33;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .p-btn:hover { background: #001a00; border-color: #33ff3377; }
  .p-btn:focus-visible { outline: 1px solid #33ff33; outline-offset: 2px; }
  .p-btn.pto  { border-color: #cc9900; color: #ffaa00; }
  .p-btn.pto:hover  { background: #0a0800; box-shadow: 0 0 6px #cc990044; }
  .p-btn.hol  { border-color: #249724; color: #33ff33; }
  .p-btn.shut { border-color: #0088bb; color: #0099cc; }
  .p-btn.shut:hover { background: #00080d; box-shadow: 0 0 6px #0099cc33; }
  .p-btn.danger { border-color: #ff4422; color: #ff4422; }
  .p-btn.danger:hover { background: #130000; box-shadow: 0 0 6px #ff442244; }
  .p-btn.quiet { color: #1a8c1a; }

  /* day dialog lives on <body> (outside the CRT's transformed layers) so position:fixed anchors to the viewport */
  .p-scrim {
    position: fixed;
    left: var(--vl, 0px); top: var(--vt, 0px);
    width: var(--vw, 100vw); height: var(--vh, 100vh);
    border-radius: 12px;
    background: rgba(0,6,0,0.72);
    z-index: 1000;
  }
  .p-sheet {
    position: fixed;
    top: calc(var(--vt, 0px) + var(--vh, 100vh) / 2);
    left: calc(var(--vl, 0px) + var(--vw, 100vw) / 2);
    transform: translate(-50%, -50%);
    width: min(calc(var(--vw, 100vw) - 24px), 420px);
    max-height: calc(var(--vh, 100vh) - 24px);
    overflow-y: auto;
    z-index: 1001;
    background: #020e02;
    border: 1px solid #33ff33;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: 'Share Tech Mono', monospace;
    color: #33ff33;
    text-shadow: 0 0 4px rgba(51,255,51,0.35);
    box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 24px #33ff3333, inset 0 0 30px rgba(0,0,0,0.5);
  }
  @media (prefers-reduced-motion: no-preference) {
    .p-sheet { animation: p-pop 0.16s ease-out; }
    @keyframes p-pop { from { opacity: 0; transform: translate(-50%, -48%) scale(0.97); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  }
  .p-sheet::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: 12px;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px);
  }
  .p-sheet h3 { font-family: 'VT323', monospace; font-weight: normal; font-size: 24px; color: #fff; letter-spacing: 3px; text-shadow: 0 0 8px #33ff3399; line-height: 1; }
  .p-sheet .p-meta { font-size: 10px; color: #1a8c1a; letter-spacing: 0.5px; margin-top: 4px; }
  .p-flow { font-family: 'VT323', monospace; font-size: 21px; letter-spacing: 1px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .p-flow b { font-weight: normal; color: #fff; text-shadow: 0 0 6px #fff; }
  .p-flow b.neg { color: #ff4422; text-shadow: 0 0 6px #ff4422; }
  .p-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .p-opts .p-btn { width: 100%; }
  .p-custom { display: flex; gap: 7px; align-items: center; }
  .p-custom input { flex: 1; }

  @media (max-width: 430px) {
    .p-flow { font-size: 18px; gap: 6px; letter-spacing: 0; }
    .tab { font-size: 16px; padding: 2px 8px 1px; letter-spacing: 1px; }
    .week-label { flex-basis: 100%; margin-left: 0; }
    .p-month { padding: 8px 7px 9px; }
    .p-mb { font-size: 9px; letter-spacing: 0; }
    .p-grid { gap: 2px; }
    .p-pname { font-size: 20px; letter-spacing: 1px; gap: 6px; }
    .p-mitem { font-size: 16px; padding: 7px 6px; }
    .p-subtab { font-size: 17px; letter-spacing: 1px; }
    .p-day { min-height: 46px; padding: 2px 3px; }
    .p-dn { font-size: 15px; }
    .p-tag { font-size: 8px; letter-spacing: 0; }
    .p-bal { font-size: 8px; letter-spacing: 0; }
  }
  @media (min-width: 768px) {
    .p-day { min-height: 62px; padding: 4px 6px; }
    .p-tag { font-size: 11px; }
    .p-bal { font-size: 10px; }
    .p-stat .v { font-size: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
    .monitor:hover { transform: none; }
  }
</style>
</head>
