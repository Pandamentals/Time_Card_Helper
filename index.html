<script>
// localStorage can throw (private mode, blocked site data); the app keeps working without saving
const store = {
  get(k)    { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
</script>
<script>
// ── PTO PLANNER ──
// Owns the PTO plan (localStorage 'pto-planner-v1') and renders into #view-pto.
// The timecard only touches it through window.PTO: getMode / setMode / render.
window.PTO = (() => {
  const DEFAULT = {"rev":3,"start":null,"asOf":null,"accrual":null,"firstPay":"2026-10-08","cap":120,"hMT":8.25,"hF":7,"end":"2027-09-30","days":{"2026-11-26":{"t":"hol","n":"Thanksgiving"},"2026-11-27":{"t":"hol","n":"Day after Thanksgiving"},"2026-12-24":{"t":"hol","n":"Christmas Eve"},"2026-12-25":{"t":"hol","n":"Christmas"},"2026-12-28":{"t":"shut","full":true,"n":"Shutdown"},"2026-12-29":{"t":"shut","full":true,"n":"Shutdown"},"2026-12-30":{"t":"shut","full":true,"n":"Shutdown"},"2026-12-31":{"t":"hol","n":"New Year's Eve"},"2027-01-01":{"t":"hol","n":"New Year's Day"},"2027-05-31":{"t":"hol","n":"Memorial Day"},"2027-07-05":{"t":"hol","n":"Independence Day (obs.)"},"2027-09-06":{"t":"hol","n":"Labor Day"}}};
  const LS_KEY = 'pto-planner-v1';
  const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const DOWS   = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  const clone = o => JSON.parse(JSON.stringify(o));
  let S = clone(DEFAULT);
  try {
    const ls = JSON.parse(store.get(LS_KEY) || 'null');
    if (ls && ls.rev > S.rev) S = ls;
  } catch (e) {}
  // plans saved before sync existed: give their edits a tiny timestamp so they export, and lose to any real edit
  Object.keys(S.days).forEach(k => {
    const base = DEFAULT.days[k];
    if (!S.days[k].u && JSON.stringify(S.days[k]) !== JSON.stringify(base)) S.days[k].u = 1;
  });
  if (!S.su && S.start != null) S.su = 1;

  let openKey = null, confirmReset = false;
  let openMonth = null;   // 'YYYY-MM' shown in the calendar; null = default to the current month
  let subTab = 'cal';     // 'cal' | 'set'
  let monthListOpen = false;   // quick-pick month list under the pager
  let monthIds = [];
  const host = document.getElementById('view-pto');
  const sheetRoot = document.createElement('div');
  document.body.appendChild(sheetRoot);

  // ── DATE / MONEY HELPERS (dates are UTC midnights so DST never shifts a day) ──
  const parse   = k => { const p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); };
  const key     = d => d.toISOString().slice(0, 10);
  const addDays = (d, n) => new Date(d.getTime() + n * 864e5);
  const r2      = x => Math.round(x * 100) / 100;
  const fmt     = x => r2(x).toFixed(2);
  const fullH   = d => d.getUTCDay() === 5 ? S.hF : S.hMT;
  const isPay   = d => { const diff = Math.round((d - parse(S.firstPay)) / 864e5); return diff >= 0 && diff % 14 === 0; };
  const entryHours = (e, d) => (!e || (e.t !== 'pto' && e.t !== 'shut')) ? 0 : (e.full ? fullH(d) : (+e.h || 0));
  const esc     = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const niceDate = k => { const d = parse(k); return `${DOWS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()].slice(0, 3)} ${d.getUTCDate()}`; };
  const todayKey = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };

  // ── LEDGER: walk day by day from the as-of date, applying payday accrual, PTO use and the Jan 1 cap ──
  function ledger() {
    let bal = S.start, d = addDays(parse(S.asOf), 1);
    const end = parse(S.end), out = {};
    let low = { v: Infinity, k: null }, used = 0, shutUsed = 0, decBefore = null;
    const forfeit = [];
    while (d <= end) {
      const k = key(d), info = {};
      if (d.getUTCMonth() === 0 && d.getUTCDate() === 1 && bal > S.cap) {
        forfeit.push({ k, h: r2(bal - S.cap) });
        bal = S.cap; info.cap = true;
      }
      if (isPay(d)) { bal = r2(bal + S.accrual); info.pay = true; }
      const e = S.days[k], h = entryHours(e, d);
      if (h) { bal = r2(bal - h); used = r2(used + h); if (e.t === 'shut') shutUsed = r2(shutUsed + h); }
      info.h = h; info.bal = bal; out[k] = info;
      const wd = d.getUTCDay();
      if (wd !== 0 && wd !== 6 && bal < low.v) low = { v: bal, k };
      if (d.getUTCMonth() === 11 && d.getUTCDate() === 31) decBefore = bal;
      d = addDays(d, 1);
    }
    return { days: out, low, used, shutUsed, forfeit, endBal: bal, decBefore };
  }

  // ── SETUP + DEVICE SYNC ──
  // A fresh install has no personal numbers: balance, its date and accrual are asked once (needsSetup).
  // Sync is manual and server-free: pack the plan into a code/link, merge it on the other device.
  // Every edited day carries a timestamp (u); on merge the newer edit to each day wins, and the settings
  // group (su) comes from whichever device changed it last.
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const NUM_KEYS = ['start', 'accrual', 'cap', 'hMT', 'hF'], DATE_KEYS = ['asOf', 'firstPay', 'end'];
  const SETTING_KEYS = NUM_KEYS.concat(DATE_KEYS);
  const UNDO_KEY = 'pto-planner-undo';
  const needsSetup = () => S.start == null || S.asOf == null || S.accrual == null;
  const validDate = v => typeof v === 'string' && DATE_RE.test(v) && key(parse(v)) === v;
  let pending = null, syncMsg = '', codeOut = '', codeOpen = false;

  function pack() {
    const d = {};
    Object.keys(S.days).forEach(k => { if (S.days[k].u) d[k] = S.days[k]; });
    const p = { v: 1, d };
    if (S.su && !needsSetup()) { p.su = S.su; p.s = {}; SETTING_KEYS.forEach(k => { p.s[k] = S[k]; }); }
    return p;
  }
  function encode(p) {
    const bytes = new TextEncoder().encode(JSON.stringify(p));
    let bin = ''; bytes.forEach(c => { bin += String.fromCharCode(c); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // codes arrive from links and pasted text: treat as untrusted, accept only well-formed plans
  function sanitize(p) {
    if (!p || p.v !== 1 || !p.d || typeof p.d !== 'object') return null;
    const keys = Object.keys(p.d);
    if (keys.length > 800) return null;
    const out = { su: 0, s: null, d: {} };
    for (const k of keys) {
      const e = p.d[k];
      if (!validDate(k) || !e || !['pto', 'hol', 'holoff', 'shut', 'none'].includes(e.t)) return null;
      const c = { t: e.t, u: Number.isFinite(e.u) ? e.u : 0 };
      if (e.full === true) c.full = true;
      if (e.h !== undefined) { if (!Number.isFinite(e.h) || e.h < 0 || e.h > 24) return null; c.h = e.h; }
      if (typeof e.n === 'string') c.n = e.n.slice(0, 60);
      out.d[k] = c;
    }
    if (p.s && typeof p.s === 'object') {
      const s = {};
      for (const k of NUM_KEYS)  { if (!Number.isFinite(p.s[k]) || p.s[k] < 0 || p.s[k] > 5000) return null; s[k] = p.s[k]; }
      for (const k of DATE_KEYS) { if (!validDate(p.s[k])) return null; s[k] = p.s[k]; }
      if (!(s.asOf < s.end) || (parse(s.end) - parse(s.asOf)) / 864e5 > 1100 || s.accrual <= 0) return null;
      out.s = s; out.su = Number.isFinite(p.su) ? p.su : 0;
    }
    return out;
  }
  function decode(text) {
    try {
      let b = String(text).trim().replace(/^.*#sync=/s, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
      b += '='.repeat((4 - b.length % 4) % 4);
      const bin = atob(b), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return sanitize(JSON.parse(new TextDecoder().decode(bytes)));
    } catch (e) { return null; }
  }
  function preview(r) {
    let newer = 0, kept = 0;
    Object.keys(r.d).forEach(k => { const a = S.days[k]; if (!a || (r.d[k].u || 0) > (a.u || 0)) newer++; else kept++; });
    return { newer, kept, settings: !!(r.s && r.su > (S.su || 0)) };
  }
  function merge(r) {
    const p = preview(r);
    store.set(UNDO_KEY, JSON.stringify(S));
    Object.keys(r.d).forEach(k => { const a = S.days[k]; if (!a || (r.d[k].u || 0) > (a.u || 0)) S.days[k] = r.d[k]; });
    if (p.settings) { Object.assign(S, r.s); S.su = r.su; }
    return p;
  }
  function copyText(text, done) {
    const fallback = () => {
      const t = document.getElementById('p-code-out');
      if (t) { t.select(); try { document.execCommand('copy'); done(true); return; } catch (e) {} }
      done(false);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
    else fallback();
  }
  const syncLink = () => location.href.split('#')[0] + '#sync=' + codeOut;

  function syncAction(a) {
    if (a === 'setup-save') return saveSetup();
    if (a === 'code-get')   { codeOut = encode(pack()); codeOpen = true; syncMsg = ''; return render(); }
    if (a === 'code-copy' || a === 'link-copy') {
      return copyText(a === 'link-copy' ? syncLink() : codeOut, ok => setSyncMsg(ok ? 'COPIED. PASTE IT INTO MERGE ON THE OTHER DEVICE.' : 'COPY FAILED: SELECT THE TEXT AND COPY IT BY HAND.'));
    }
    if (a === 'link-share') {
      if (navigator.share) { navigator.share({ title: 'PTO plan', url: syncLink() }).catch(() => {}); return; }
      return syncAction('link-copy');
    }
    if (a === 'merge-code') {
      const box = document.getElementById('p-code-in');
      const r = box && box.value.trim() ? decode(box.value) : null;
      if (!r) { syncMsg = box && box.value.trim() ? 'THAT CODE COULD NOT BE READ. COPY IT AGAIN IN FULL.' : 'PASTE A CODE OR LINK FIRST.'; return render(); }
      pending = r; syncMsg = ''; return render();
    }
    if (a === 'merge-cancel') { pending = null; syncMsg = ''; return render(); }
    if (a === 'merge-confirm' && pending) {
      const p = merge(pending); pending = null;
      syncMsg = `MERGED: ${p.newer} DAY${p.newer === 1 ? '' : 'S'} FROM THE CODE, ${p.kept} KEPT FROM THIS DEVICE. SETTINGS ${p.settings ? 'TAKEN FROM THE CODE' : 'KEPT FROM THIS DEVICE'}.`;
      return changed();
    }
    if (a === 'undo') {
      const prev = store.get(UNDO_KEY);
      if (!prev) return;
      try { S = JSON.parse(prev); } catch (e) { return; }
      store.remove(UNDO_KEY); syncMsg = 'LAST MERGE UNDONE.'; return changed();
    }
  }
  function setSyncMsg(t) { syncMsg = t; const el = document.getElementById('p-sync-msg'); if (el) el.textContent = t; }

  function saveSetup() {
    const err = t => { const el = document.getElementById('p-setup-err'); if (el) el.textContent = t; };
    const bal = parseFloat(document.getElementById('ps_start').value);
    const acc = parseFloat(document.getElementById('ps_accrual').value);
    const asOf = document.getElementById('ps_asOf').value;
    if (isNaN(bal) || bal < 0)       return err('ENTER YOUR CURRENT PTO BALANCE (0 OR MORE).');
    if (!validDate(asOf))            return err('PICK THE DATE THAT BALANCE IS FROM.');
    if (asOf >= S.end)               return err(`THAT DATE MUST BE BEFORE THE PLAN ENDS (${S.end}).`);
    if (isNaN(acc) || acc <= 0)      return err('ENTER HOW MANY HOURS YOU EARN EACH PAYDAY.');
    S.start = r2(bal); S.asOf = asOf; S.accrual = r2(acc); S.su = Date.now();
    changed();
  }

  const pasteBox = () => `<label class="p-lbl" for="p-code-in">PASTE A SYNC CODE OR LINK</label><textarea class="p-code" id="p-code-in" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="p-row"><button type="button" class="p-btn hol" data-sync="merge-code">[ MERGE CODE ]</button>${store.get(UNDO_KEY) ? '<button type="button" class="p-btn quiet" data-sync="undo">[ UNDO LAST MERGE ]</button>' : ''}</div>
    <p class="p-note" id="p-sync-msg" role="status">${esc(syncMsg)}</p>`;
  const pendingHtml = () => {
    if (!pending) return '';
    const p = preview(pending), n = Object.keys(pending.d).length;
    return `<div class="p-panel p-pending" role="alert"><div class="p-subhead">CODE FROM ANOTHER DEVICE</div>
      <p class="p-note">${n} DAY ENTR${n === 1 ? 'Y' : 'IES'}: ${p.newer} NEWER THAN THIS DEVICE, ${p.kept} KEPT FROM THIS DEVICE. SETTINGS: ${p.settings ? 'TAKEN FROM THE CODE (NEWER)' : 'KEPT FROM THIS DEVICE'}.</p>
      <div class="p-row"><button type="button" class="p-btn hol" data-sync="merge-confirm">[ MERGE ]</button><button type="button" class="p-btn quiet" data-sync="merge-cancel">[ CANCEL ]</button></div></div>`;
  };
  const setupHtml = () => `<div><div class="p-title">PTO PLANNER</div><div class="p-sub">FIRST-TIME SETUP &nbsp;|&nbsp; ENTER YOUR OWN NUMBERS</div></div>
    <div class="p-panel"><div class="p-form">
      <label for="ps_start">PTO balance (H)<input id="ps_start" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label for="ps_asOf">Balance as of<input id="ps_asOf" type="date" value="${todayKey()}"></label>
      <label for="ps_accrual">Accrual per payday (H)<input id="ps_accrual" type="number" step="0.01" min="0" inputmode="decimal"></label>
    </div>
    <p class="p-note">TAKE THESE FROM YOUR LATEST PAYSTUB OR HR PORTAL. HOLIDAYS, SHUTDOWN DAYS, FIRST PAYDAY, ROLLOVER CAP AND DAY LENGTHS ARE ALREADY SET FOR THE COMPANY; EDIT THEM LATER IN SETTINGS.</p>
    <p class="p-err" id="p-setup-err" role="alert"></p>
    <div class="p-row"><button type="button" class="p-btn hol" data-sync="setup-save">[ SAVE &amp; START ]</button></div></div>
    <div class="p-panel"><div class="p-subhead">ALREADY SET UP ON ANOTHER DEVICE?</div>${pasteBox()}</div>`;
  const syncHtml = () => `<div class="p-sync"><div class="p-subhead">SYNC DEVICES</div>
    <p class="p-note">EDIT ON ANY DEVICE, THEN MOVE THE PLAN ACROSS. ON MERGE THE NEWER EDIT TO EACH DAY WINS, SO NOTHING IS LOST.</p>
    <div class="p-row"><button type="button" class="p-btn" data-sync="code-get">[ GET CODE ]</button></div>
    ${codeOpen ? `<textarea class="p-code" id="p-code-out" readonly rows="4" spellcheck="false" aria-label="Sync code">${esc(codeOut)}</textarea>
    <div class="p-row"><button type="button" class="p-btn" data-sync="code-copy">[ COPY CODE ]</button><button type="button" class="p-btn" data-sync="link-copy">[ COPY LINK ]</button><button type="button" class="p-btn" data-sync="link-share">[ SHARE ]</button></div>` : ''}
    ${pasteBox()}</div>`;

  // ── RENDER ──
  function render() {
    if (!host) return;
    if (needsSetup()) { host.innerHTML = pendingHtml() + setupHtml(); renderSheet(); return; }
    const L = ledger(), tk = todayKey();
    const todayInfo = L.days[tk];
    const todayBal = todayInfo ? todayInfo.bal : (tk > S.end ? L.endBal : S.start);   // end of today, incl. planned PTO
    const lowBad = L.low.v < 0, fTotal = L.forfeit.reduce((a, b) => a + b.h, 0);
    const first = addDays(parse(S.asOf), 1), last = parse(S.end);
    const span = d => `${MONTHS[d.getUTCMonth()].slice(0, 3)} ${d.getUTCFullYear()}`;
    let h = pendingHtml() + `<div><div class="p-title">PTO PLANNER</div><div class="p-sub">${span(first)} TO ${span(last)} &nbsp;|&nbsp; +${fmt(S.accrual)}H EVERY OTHER THURSDAY</div></div>`;
    h += `<div class="p-stats">
      <div class="p-stat"><span class="k">Balance today</span><span class="v">${fmt(todayBal)}H</span><span class="n">${tk > S.asOf && tk <= S.end ? `PROJECTED FROM ${fmt(S.start)}H ON ${niceDate(S.asOf)}` : `AS OF ${niceDate(S.asOf)}`}</span><button type="button" class="p-tile-btn" id="p-update">[ UPDATE ]</button></div>
      <div class="p-stat"><span class="k">Planned PTO</span><span class="v">${fmt(L.used)}H</span><span class="n">${fmt(L.shutUsed)}H IS SHUTDOWN</span></div>
      <div class="p-stat${fTotal > 0 ? ' warn' : ''}"><span class="k">Dec 31 balance</span><span class="v">${L.decBefore == null ? '-' : fmt(L.decBefore) + 'H'}</span><span class="n">${fTotal > 0 ? `${fmt(fTotal)}H OVER THE ${fmt(S.cap)}H CAP, LOST JAN 1` : `UNDER THE ${fmt(S.cap)}H ROLLOVER CAP`}</span></div>
      <div class="p-stat${lowBad ? ' bad' : ''}"><span class="k">Lowest point</span><span class="v">${fmt(L.low.v)}H</span><span class="n">${L.low.k ? niceDate(L.low.k) : ''}${lowBad ? ' · OVERDRAWN' : ''}</span></div>
    </div>`;

    const end = parse(S.end), months = [];
    for (let m = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1)); m <= end; m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1))) months.push(m);
    // one summary per month feeds the year strip and the pager
    const sums = months.map(m => {
      const y = m.getUTCFullYear(), mo = m.getUTCMonth(), last = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
      const lastInfo = L.days[key(new Date(Date.UTC(y, mo, last)))];
      let used = 0, dip = false;
      for (let i = 1; i <= last; i++) { const ii = L.days[key(new Date(Date.UTC(y, mo, i)))]; if (ii) { used += ii.h; if (ii.bal < 0) dip = true; } }
      return { id: key(m).slice(0, 7), m, y, mo, last, used, dip, end: lastInfo ? lastInfo.bal : null };
    });
    monthIds = sums.map(x => x.id);
    const nowId = tk.slice(0, 7);
    if (!monthIds.includes(openMonth)) openMonth = monthIds.includes(nowId) ? nowId : (tk < monthIds[0] ? monthIds[0] : monthIds[monthIds.length - 1]);
    const idx = monthIds.indexOf(openMonth), cur = sums[idx];

    h += `<div class="p-subtabs" role="tablist" aria-label="Planner sections">
      <button type="button" role="tab" class="p-subtab" id="ptab-cal" data-subtab="cal" aria-selected="${subTab === 'cal'}" aria-controls="p-panel" tabindex="${subTab === 'cal' ? 0 : -1}">[ CALENDAR ]</button>
      <button type="button" role="tab" class="p-subtab" id="ptab-set" data-subtab="set" aria-selected="${subTab === 'set'}" aria-controls="p-panel" tabindex="${subTab === 'set' ? 0 : -1}">[ SETTINGS ]</button></div>`;

    if (subTab === 'set') {
      const fld = (lbl, id, v, type) => `<label for="pf_${id}">${lbl}<input id="pf_${id}" data-f="${id}" type="${type || 'number'}" step="0.01" inputmode="decimal" value="${esc(v)}"></label>`;
      h += `<div class="p-panel" id="p-panel" role="tabpanel" aria-labelledby="ptab-set"><div class="p-form">
        ${fld('Balance (H)', 'start', S.start)}${fld('Balance as of', 'asOf', S.asOf, 'date')}
        ${fld('Plan ends', 'end', S.end, 'date')}${fld('Accrual per payday (H)', 'accrual', S.accrual)}
        ${fld('Rollover cap Jan 1 (H)', 'cap', S.cap)}${fld('First payday', 'firstPay', S.firstPay, 'date')}
        ${fld('Mon to Thu day (H)', 'hMT', S.hMT)}${fld('Friday day (H)', 'hF', S.hF)}
        </div><div class="p-row"><button type="button" class="p-btn danger" id="p-reset">${confirmReset ? 'TAP AGAIN TO RESET EVERYTHING' : '[ RESET PLAN ]'}</button>${confirmReset ? '<button type="button" class="p-btn" id="p-reset-cancel">CANCEL</button>' : ''}</div>
        <p class="p-note">ENTER YOUR REAL BALANCE AND ITS DATE TO RE-SYNC WITH YOUR PAYSTUB; DAYS BEFORE THAT DATE ARE LEFT OUT. FULL DAYS FOLLOW THE HOURS ABOVE. TAP ANY WEEKDAY TO ADD, EDIT OR REMOVE PTO. HOLIDAYS AND SHUTDOWN DAYS CAN BE CHANGED THE SAME WAY.</p>${syncHtml()}</div>`;
    } else {
      h += `<div class="p-legend">
        <span><i class="p-sw sw-pto"></i>Your PTO</span>
        <span><i class="p-sw sw-shut"></i>Shutdown</span>
        <span><i class="p-sw sw-hol"></i>Paid holiday</span>
        <span><i class="p-sw sw-pay"></i>Payday</span>
        <span><i class="p-sw sw-neg"></i>Below zero</span>
      </div>`;
      h += `<div class="p-pager"><button type="button" class="p-arrow" data-page="-1" aria-label="Previous month"${idx === 0 ? ' disabled' : ''}>‹</button>
        <div class="p-pname"><span aria-live="polite">${MONTHS[cur.mo]} ${cur.y}</span><button type="button" class="p-mtoggle" id="p-mtoggle" data-mtoggle aria-expanded="${monthListOpen}" aria-controls="p-mlist" aria-label="Choose a month">${monthListOpen ? '▴' : '▾'}</button></div>
        <button type="button" class="p-arrow" data-page="1" aria-label="Next month"${idx === monthIds.length - 1 ? ' disabled' : ''}>›</button></div>`;
      if (monthListOpen) {
        // quick pick: jump to any month in one tap; red = ends below zero, "!" = dips below zero during the month
        const todayItem = monthIds.includes(nowId) && nowId !== openMonth;
        h += `<div class="p-mlist" id="p-mlist" role="group" aria-label="Choose a month">${todayItem ? `<button type="button" class="p-mitem p-mnow" data-month="${nowId}"><span>TODAY</span><b>${MONTHS[sums[monthIds.indexOf(nowId)].mo].slice(0, 3)} ${sums[monthIds.indexOf(nowId)].y}</b></button>` : ''}${sums.map(x => {
          const neg = x.end != null && x.end < 0;
          return `<button type="button" class="p-mitem${x.id === openMonth ? ' sel' : ''}${x.id === nowId ? ' now' : ''}" data-month="${x.id}" aria-current="${x.id === openMonth}" aria-label="${MONTHS[x.mo]} ${x.y}, ends ${x.end != null ? fmt(x.end) : 'n/a'} hours${x.dip ? ', goes below zero' : ''}"><span>${MONTHS[x.mo].slice(0, 3)} ${x.y}</span><b class="${neg ? 'neg' : ''}">${x.dip ? '<em>!</em> ' : ''}${x.end != null ? fmt(x.end) : '-'}H</b></button>`;
        }).join('')}</div>`;
      }
      h += `<section class="p-month" id="p-panel" role="tabpanel" aria-labelledby="ptab-cal"><div class="p-mb p-mbline${cur.end != null && cur.end < 0 ? ' neg' : ''}">${cur.used ? `-${fmt(cur.used)}H USED · ` : ''}ENDS ${cur.end != null ? fmt(cur.end) : '-'}H</div><div class="p-grid">`;
      DOWS.forEach(d => { h += `<div class="p-dow">${d.charAt(0)}</div>`; });
      for (let j = 0; j < cur.m.getUTCDay(); j++) h += '<div class="p-day empty"></div>';
      for (let dn = 1; dn <= cur.last; dn++) {
        const d = new Date(Date.UTC(cur.y, cur.mo, dn)), k = key(d), wd = d.getUTCDay(), info = L.days[k] || {}, e = S.days[k];
        if (wd === 0 || wd === 6) { h += `<div class="p-day wk"><span class="p-dn">${dn}</span>${info.pay ? '<i class="p-pay"></i>' : ''}</div>`; continue; }
        if (info.bal === undefined) { h += `<div class="p-day wk"><span class="p-dn">${dn}</span></div>`; continue; }   // outside the plan window
        let cls = 'p-day', tag = '', showBal = false;
        if (e) {
          if (e.t === 'pto')        { cls += ' pto';    tag = '-' + fmt(info.h); showBal = true; }
          else if (e.t === 'hol')   { cls += ' hol';    tag = 'HOL'; }
          else if (e.t === 'holoff'){ cls += ' holoff'; tag = 'HOL'; }
          else if (e.t === 'shut')  { cls += ' shut';   tag = info.h ? '-' + fmt(info.h) : 'UNPD'; showBal = true; }
        }
        if (info.pay) showBal = true;
        if (info.bal < 0) { cls += ' neg'; showBal = true; }
        if (k === tk) cls += ' today';
        const label = `${niceDate(k)}${e && e.n ? ', ' + e.n : ''}${tag ? ', ' + tag : ''}, balance ${fmt(info.bal)} hours`;
        h += `<button type="button" class="${cls}" data-k="${k}" aria-label="${esc(label)}"><span class="p-dn">${dn}</span>${info.cap ? '<span class="p-cap">CAP</span>' : (info.pay ? '<i class="p-pay"></i>' : '')}<span class="p-tag">${esc(tag)}</span><span class="p-bal">${showBal ? fmt(info.bal) : ''}</span></button>`;
      }
      h += '</div></section>';
    }

    const y0 = window.scrollY;
    host.innerHTML = h;
    window.scrollTo(0, y0);
    renderSheet(L);
  }

  // ── DAY SHEET ──
  function renderSheet(L) {
    document.getElementById('monitor').inert = !!openKey;   // keep keyboard/screen-reader focus inside the dialog
    if (!openKey) { sheetRoot.innerHTML = ''; return; }
    L = L || ledger();
    const k = openKey, d = parse(k), e = S.days[k], info = L.days[k] || { bal: S.start }, full = fullH(d);
    const prev = L.days[key(addDays(d, -1))];
    let before = prev ? prev.bal : S.start;
    if (info.cap) before = Math.min(before, S.cap);
    if (info.pay) before = r2(before + S.accrual);
    const btn = (act, label, cls) => `<button type="button" class="p-btn ${cls || ''}" data-act="${act}">${label}</button>`;
    let b = `<div class="p-scrim" data-act="close"></div><div class="p-sheet" role="dialog" aria-modal="true" aria-labelledby="p-sh-t">
      <div><h3 id="p-sh-t">${niceDate(k)} ${d.getUTCFullYear()}</h3><p class="p-meta">${e && e.n ? esc(e.n).toUpperCase() + ' · ' : ''}${info.pay ? `PAYDAY +${fmt(S.accrual)}H · ` : ''}FULL DAY HERE IS ${fmt(full)}H</p></div>
      <div class="p-flow">START <b>${fmt(before)}</b> &rarr; END <b class="${info.bal < 0 ? 'neg' : ''}">${fmt(info.bal)}</b> H</div><div class="p-opts">`;
    if (e && e.t === 'hol')         b += btn('holoff', 'Working this day', 'danger') + btn('close', 'Keep holiday', 'quiet');
    else if (e && e.t === 'holoff') b += btn('holon', 'Restore paid holiday', 'hol') + btn('full', 'PTO full day', 'pto');
    else if (e && e.t === 'shut')   b += btn('shutfull', `Cover with PTO (${fmt(full)})`, 'pto') + btn('shutunpaid', 'Leave unpaid', 'shut');
    else b += btn('full', `Full day (${fmt(full)})`, 'pto') + btn('half', `Half day (${fmt(r2(full / 2))})`, 'pto') + btn('addhol', 'Paid holiday', 'hol')
      + (e && e.t === 'pto' ? btn('clear', 'Remove PTO', 'danger') : btn('close', 'Cancel', 'quiet'));
    b += '</div>';
    if (!(e && e.t === 'hol')) {
      const cur = (e && (e.t === 'pto' || e.t === 'shut')) ? entryHours(e, d) : '';
      b += `<div class="p-custom"><input id="p-customH" type="number" step="0.25" min="0" inputmode="decimal" placeholder="CUSTOM HOURS" value="${cur !== '' && !(e && e.full) ? cur : ''}" aria-label="Custom hours"><button type="button" class="p-btn" data-act="custom">Set hours</button></div>`;
    }
    if (e && e.t === 'hol') b += '<p class="p-note">PAID HOLIDAYS USE NO PTO. MARK IT AS A WORKING DAY IF THE OFFICE IS OPEN.</p>';
    if (e && e.t === 'shut') b += '<p class="p-note">OFFICE CLOSED. COVERING IT USES PTO; LEAVING IT UNPAID KEEPS YOUR BALANCE.</p>';
    sheetRoot.innerHTML = b + '</div>';
    fitSheet();
  }

  // keep the dialog inside the monitor: size it to the part of the CRT screen currently in view
  function fitSheet() {
    const scr = document.querySelector('.screen');
    if (!scr || !openKey) return;
    const r = scr.getBoundingClientRect();
    const top = Math.max(r.top, 0), bottom = Math.min(r.bottom, window.innerHeight);
    const st = sheetRoot.style;
    st.setProperty('--vl', r.left + 'px');
    st.setProperty('--vw', r.width + 'px');
    st.setProperty('--vt', top + 'px');
    st.setProperty('--vh', Math.max(bottom - top, 0) + 'px');
  }

  // every edit carries a timestamp; removals leave a tombstone so a merge can tell "deleted" from "never set"
  const put   = (k, entry) => { S.days[k] = Object.assign(entry, { u: Date.now() }); };
  const clear = k => { S.days[k] = { t: 'none', u: Date.now() }; };

  // one month on screen at a time; the year strip, TODAY and the arrows all land here
  function showMonth(id, focusSel) {
    if (!monthIds.includes(id)) return;
    openMonth = id; monthListOpen = false; render();
    const el = focusSel && host.querySelector(focusSel);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
  function stepMonth(delta) {
    const i = monthIds.indexOf(openMonth) + delta;
    if (i >= 0 && i < monthIds.length) showMonth(monthIds[i], `[data-page="${delta}"]`);
  }
  function showSub(name) {
    subTab = name; monthListOpen = false; render();
    const t = document.getElementById(name === 'set' ? 'ptab-set' : 'ptab-cal');
    if (t) t.focus({ preventScroll: true });
  }

  function focusCell(k) {
    const cell = host.querySelector(`[data-k="${k}"]`);
    if (cell) cell.focus({ preventScroll: true });
  }
  function closeSheet() {
    const k = openKey;
    openKey = null; render();
    focusCell(k);
  }

  function act(a) {
    const k = openKey, e = S.days[k], name = e && e.n;
    if (a === 'close') { closeSheet(); return; }
    if (a === 'full')            put(k, { t: 'pto', full: true });
    else if (a === 'half')       put(k, { t: 'pto', h: r2(fullH(parse(k)) / 2) });
    else if (a === 'clear')      clear(k);
    else if (a === 'addhol')     put(k, { t: 'hol', n: 'Company holiday' });
    else if (a === 'holoff')     put(k, { t: 'holoff', n: name });
    else if (a === 'holon')      put(k, { t: 'hol', n: name });
    else if (a === 'shutfull')   put(k, { t: 'shut', full: true, n: name });
    else if (a === 'shutunpaid') put(k, { t: 'shut', h: 0, n: name });
    else if (a === 'custom') {
      const v = parseFloat(document.getElementById('p-customH').value);
      if (isNaN(v) || v < 0) return;
      if (e && e.t === 'shut') put(k, { t: 'shut', h: r2(v), n: name });
      else if (v === 0) clear(k);
      else put(k, { t: 'pto', h: r2(v) });
    }
    if (name && S.days[k] && S.days[k].t !== 'none' && !S.days[k].n) S.days[k].n = name;
    openKey = null; changed();
    focusCell(k);
  }

  function changed() {
    S.rev = (S.rev || 1) + 1;
    try { store.set(LS_KEY, JSON.stringify(S)); } catch (e) {}
    if (host && !host.hidden) render();
  }

  // ── EVENTS (delegated once; render() replaces the markup, not the host) ──
  if (host) {
    host.addEventListener('click', e => {
      const sb = e.target.closest('[data-sync]');
      if (sb) { syncAction(sb.dataset.sync); return; }
      const day = e.target.closest('button.p-day');
      if (day) {
        openKey = day.dataset.k; render();
        const first = sheetRoot.querySelector('.p-btn'); if (first) first.focus();
        return;
      }
      const st = e.target.closest('[data-subtab]');
      if (st) { if (st.dataset.subtab !== subTab) showSub(st.dataset.subtab); return; }
      if (e.target.closest('[data-mtoggle]')) {
        monthListOpen = !monthListOpen; render();
        const target = monthListOpen ? (host.querySelector('.p-mitem.sel') || host.querySelector('.p-mitem')) : document.getElementById('p-mtoggle');
        if (target) target.focus({ preventScroll: true });
        return;
      }
      const mb = e.target.closest('[data-month]');
      if (mb) { showMonth(mb.dataset.month, '#p-mtoggle'); return; }
      const pg = e.target.closest('[data-page]');
      if (pg) { stepMonth(parseInt(pg.dataset.page, 10)); return; }
      if (e.target.closest('#p-update')) {
        subTab = 'set'; render();
        const inp = document.getElementById('pf_start');
        inp.scrollIntoView({ block: 'center' });
        inp.focus(); inp.select();
        return;
      }
      if (e.target.closest('#p-reset')) {
        if (!confirmReset) { confirmReset = true; render(); return; }
        const rev = S.rev; S = clone(DEFAULT); S.rev = rev; confirmReset = false; changed(); return;
      }
      if (e.target.closest('#p-reset-cancel')) { confirmReset = false; render(); }
    });
    host.addEventListener('change', e => {
      const f = e.target.dataset && e.target.dataset.f;
      if (!f) return;
      const v = e.target.value;
      if (f === 'firstPay' || f === 'asOf' || f === 'end') {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(parse(v))) { e.target.value = S[f]; return; }
        const asOf = f === 'asOf' ? v : S.asOf, end = f === 'end' ? v : S.end;
        // the plan needs at least one day, and stays small enough to render (max ~3 years)
        if (f !== 'firstPay' && (end <= asOf || (parse(end) - parse(asOf)) / 864e5 > 1100)) { e.target.value = S[f]; return; }
        S[f] = v;
      }
      else {
        const n = parseFloat(v);
        if (isNaN(n) || n < 0) { e.target.value = S[f]; return; }
        S[f] = n;
      }
      S.su = Date.now();
      changed();
    });
  }
  if (host) {
    // swipe the month left/right (mostly-horizontal, ignoring scrolls)
    let sx = null, sy = null;
    host.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    host.addEventListener('touchend', e => {
      if (sx === null) return;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
      if (subTab === 'cal' && !openKey && Math.abs(dx) > 70 && Math.abs(dy) < 35 && e.target.closest('.p-month')) stepMonth(dx < 0 ? 1 : -1);
    }, { passive: true });
    host.addEventListener('keydown', e => {
      if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.closest('.p-subtabs')) showSub(subTab === 'cal' ? 'set' : 'cal');
      if (e.key === 'Escape' && monthListOpen && !openKey) {
        monthListOpen = false; render();
        const t = document.getElementById('p-mtoggle'); if (t) t.focus({ preventScroll: true });
      }
    });
  }
  sheetRoot.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) act(a.dataset.act);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openKey) closeSheet(); });
  window.addEventListener('scroll', fitSheet, { passive: true });
  window.addEventListener('resize', fitSheet);

  // ── API FOR THE TIMECARD ──
  // mode: 'hol' paid holiday · 'pto' full-day PTO (incl. shutdown covered by PTO) · 'off' unpaid shutdown
  //       'partial' part-day PTO (hours = credit) · 'none' ordinary working day (working = holiday marked as worked)
  function getMode(k) {
    const e = S.days[k], d = parse(k), name = (e && e.n) || '';
    if (!e) return { mode: 'none', hours: 0, name, working: false };
    if (e.t === 'hol')    return { mode: 'hol', hours: 0, name, working: false };
    if (e.t === 'holoff') return { mode: 'none', hours: 0, name, working: true };
    const h = entryHours(e, d);
    if (e.t === 'shut' && h === 0) return { mode: 'off', hours: 0, name, working: false };
    if (h >= fullH(d) - 0.001)     return { mode: 'pto', hours: h, name, working: false };
    return { mode: h > 0 ? 'partial' : 'none', hours: h, name, working: false };
  }
  // The timecard's [HOL]/[PTO] buttons write here, so the planner stays the source of truth.
  // Turning a button off restores the day's built-in nature (a seeded holiday becomes "working", a shutdown becomes unpaid).
  function setMode(k, mode) {
    const e = S.days[k], base = DEFAULT.days[k];
    const name = (e && e.n) || (base && base.n) || '';
    const shut = (e && e.t === 'shut') || (base && base.t === 'shut');
    const named = o => { if (name) o.n = name; return o; };
    if (mode === 'hol')                    put(k, { t: 'hol', n: name || 'Company holiday' });
    else if (mode === 'pto')               put(k, named(shut ? { t: 'shut', full: true } : { t: 'pto', full: true }));
    else if (base && base.t === 'hol')     put(k, { t: 'holoff', n: base.n });
    else if (shut)                         put(k, named({ t: 'shut', h: 0 }));
    else                                   clear(k);
    changed();
  }

  // a sync link opened on this device: stash it for confirmation (never applied silently)
  let incoming = false;
  const m = /^#sync=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (m) {
    incoming = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    pending = decode(m[1]);
    if (!pending) syncMsg = 'THAT LINK COULD NOT BE READ. COPY THE CODE INSTEAD.';
  }

  return { render, getMode, setMode, needsSetup, hasIncoming: () => incoming };
})();
</script>
<script>
// ── CONFIG ──
const DAYS_CONFIG = [
  { name: 'MONDAY',    defaultIn: '08:00', defaultOut: '17:15', defaultLunch: 60, baseTarget: 8.25 },
  { name: 'TUESDAY',   defaultIn: '08:00', defaultOut: '17:15', defaultLunch: 60, baseTarget: 8.25 },
  { name: 'WEDNESDAY', defaultIn: '08:00', defaultOut: '17:15', defaultLunch: 60, baseTarget: 8.25 },
  { name: 'THURSDAY',  defaultIn: '08:00', defaultOut: '17:15', defaultLunch: 60, baseTarget: 8.25 },
  { name: 'FRIDAY',    defaultIn: '08:00', defaultOut: '15:30', defaultLunch: 30, baseTarget: 7.00 },
];
const LUNCH_OPTIONS  = [30, 45, 60];
const HOLIDAY_HOURS  = 8.0;
const PTO_HOURS      = 8.25;
const STORAGE_KEY    = 'timecard_v3';
const THEME_KEY      = 'timecard_theme';

// temp store for times when a day goes holiday
const savedTimes = {};

// ── BUILD DOM ──
const container = document.getElementById('rows');

DAYS_CONFIG.forEach((day, i) => {
  const btns = LUNCH_OPTIONS.map(m => {
    const label  = m === 60 ? '1H' : `${m}M`;
    const active = m === day.defaultLunch;
    return `<button class="lunch-btn${active ? ' active' : ''}" data-day="${i}" data-val="${m}" aria-pressed="${active}" title="Set lunch break to ${label}">${label}</button>`;
  }).join('');

  const dc = document.createElement('div');
  dc.className = 'day-card';
  dc.id = `card-${i}`;
  dc.innerHTML = `
    <div class="day-top">

// ── HELPERS ──
function roundQ(min) {
  const r = min % 15;
  return r < 7.5 ? Math.floor(min / 15) * 15 : Math.ceil(min / 15) * 15;
}
function toMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function isHolidayDay(i) {
  return !!document.querySelector(`.hol-btn[data-day="${i}"]`)?.classList.contains('active');
}
function isPtoDay(i) {
  return !!document.querySelector(`.pto-btn[data-day="${i}"]`)?.classList.contains('active');
}
function isOffDay(i) {
  return document.getElementById(`card-${i}`).classList.contains('is-off');
}
function isAwayDay(i) {
  return !!document.querySelector(`.away-btn[data-day="${i}"]`)?.classList.contains('active');
}
function getAwayMins(i) {
  const awIn  = document.getElementById(`away-in-${i}`).value;
  const awOut = document.getElementById(`away-out-${i}`).value;
  if (!awIn || !awOut) return 0;
  const mins = roundQ(toMin(awOut)) - roundQ(toMin(awIn));
  return mins > 0 ? mins : 0;
}
function fridayIsHoliday() { return isHolidayDay(4); }
function setPressed(el, active) {
  if (!el) return;
  el.classList.toggle('active', active);
  el.setAttribute('aria-pressed', String(active));
}

// per-day effective target (accounts for Friday holiday ripple on Mon–Thu)
function effectiveTarget(i) {
  if (isOffDay(i)) return 0; // unpaid shutdown: nothing owed
  if (isPtoDay(i)) return DAYS_CONFIG[i].baseTarget; // PTO credits the day's normal hours (7H on Friday)
  if (isHolidayDay(i)) {
    if (i === 4) return HOLIDAY_HOURS;
    return (i < 4 && fridayIsHoliday()) ? 8.00 : DAYS_CONFIG[i].baseTarget;
  }
  if (i < 4 && fridayIsHoliday()) return 8.00;
  return DAYS_CONFIG[i].baseTarget;
}

// dynamic weekly target
function weeklyTarget() {
  let t = 0;
  for (let i = 0; i < 5; i++) t += effectiveTarget(i);
  return t;
}

// ── MASCOT MOTION ──
// Tic is drawn in the markup above; this drives it. Body, arms, legs and bell are springs, eyes glance and blink,
// and the mood sets how calm or jittery everything is. Hover (mouse) and tap are small reactions; on target and
// over target, Tic also waves hello on load. Does nothing where requestAnimationFrame is missing.
const ticMotion = (() => {
  const panel = document.getElementById('mascotPanel');
  const svg = panel && panel.querySelector('.time-mascot');
  const noop = { setMood() {} };
  if (!svg || typeof requestAnimationFrame !== 'function') return noop;
  const el = {};
  svg.querySelectorAll('[data-p]').forEach(n => { el[n.dataset.p] = n; });

  const BOLD = 0.6;                                   // overall motion strength (1 = full)
  const reduced = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = t => t * t * (3 - 2 * t);
  const noise = (t, s) => (Math.sin(t * 17.3 + s) + Math.sin(t * 29.1 + s * 2.7) * 0.6 + Math.sin(t * 43.7 + s * 1.3) * 0.4) / 2;
  const spring = (s, target, k, c, dt) => { const h = dt / 3; for (let i = 0; i < 3; i++) { s.v += (k * (target - s.x) - c * s.v) * h; s.x += s.v * h; } };
  const mk = () => ({ x: 0, v: 0 });

  // motion per mood; every "short" mood moves like the worried one
  const MOTION = {
    good:    { bobAmp: 3.2, bobF: 0.38, bounce: 0.15, sq: 0.06, swayA: 1.6, swayF: 0.19, armBase: 5,   armAmp: 8,  armF: 0.38, legAmp: 2.5, jit: 0,    jitRot: 0,   mouthA: 0.07, mouthQ: 0,   eyeR: 3, eyeMin: 1.2, eyeMax: 3.2, blkMin: 2,   blkMax: 5,   browA: 0.5 },
    worried: { bobAmp: 2.2, bobF: 0.6,  bounce: 0,    sq: 0.03, swayA: 2.6, swayF: 0.5,  armBase: -12, armAmp: 10, armF: 1.25, legAmp: 3,   jit: 0.15, jitRot: 0.2, mouthA: 0.1,  mouthQ: 0.1, eyeR: 4, eyeMin: 0.5, eyeMax: 1.2, blkMin: 1.2, blkMax: 2.6, browA: 1.2 },
    over:    { bobAmp: 6.2, bobF: 0.8,  bounce: 0.8,  sq: 0.12, swayA: 3.2, swayF: 0.4,  armBase: 42,  armAmp: 17, armF: 0.8,  legAmp: 5,   jit: 0,    jitRot: 0,   mouthA: 0.13, mouthQ: 0,   eyeR: 2, eyeMin: 1.8, eyeMax: 4,   blkMin: 3,   blkMax: 6,   browA: 1.2 },
  };
  MOTION.stressed = MOTION.worried;
  MOTION.meltdown = MOTION.worried;
  const KEYS = Object.keys(MOTION.good);
  const HOP_H = 15;

  let mood = ([...panel.classList].find(c => c.startsWith('mascot-status-')) || 'mascot-status-good').slice(14);
  if (!MOTION[mood]) mood = 'good';
  const cur = { ...MOTION[mood] };
  const calm = () => mood === 'good' || mood === 'over';
  const s = { armL: mk(), armR: mk(), legL: mk(), legR: mk(), bell: mk(), px: mk(), py: mk(), popS: mk(), popR: mk(), faceX: mk(), faceY: mk(), settle: mk() };

  let t = 0, last = null, armed = false, greetAt = null;
  let bobPh = rand(0, TAU), swayPh = rand(0, TAU), armPh = 0, prevBph = 0, lastY = 0, vy = 0;
  let gaze = { x: 0, y: 0 }, pend = null, nextSaccade = 0, nextBlink = rand(1, 3), blinkAt = -9, dbl = false, gagAt = rand(5, 9), lookSeq = null;
  let tap = { at: -9, dir: 1, H: HOP_H, landed: true }, hello = { at: -9 };
  let hover = 0, hoverTarget = 0;
  const cursor = { x: 0, y: 0 };
  const motionScale = () => BOLD * (reduced.matches ? 0.4 : 1);

  function startTap(scale) { tap = { at: t, dir: -tap.dir, H: HOP_H * scale * motionScale(), landed: false }; }
  function sayHello() { if (!calm()) return; hello.at = t + 0.05; startTap(0.8); nextBlink = t + 0.8; }

  function tapPose(M) {
    const u = (t - tap.at) / 0.62;
    if (u < 0 || u > 1) return { y: 0, sq: 0, arm: 0, tilt: 0 };
    if (u < 0.16) { const k = Math.sin(u / 0.16 * Math.PI / 2); return { y: 2.6 * k, sq: 0.16 * k, arm: -14 * k, tilt: 0 }; }
    if (u < 0.86) {
      const f = (u - 0.16) / 0.7;
      return { y: -tap.H * 4 * f * (1 - f), sq: -0.11 * Math.sin(f * Math.PI), arm: 48 * Math.sin(f * Math.PI), tilt: tap.dir * Math.sin(f * Math.PI) };
    }
    if (!tap.landed) { tap.landed = true; s.settle.v += 34 * M; }
    const k = (u - 0.86) / 0.14;
    return { y: 0, sq: 0.2 * Math.sin(k * Math.PI), arm: -10 * Math.sin(k * Math.PI), tilt: 0 };
  }

  function helloPose() {
    const u = (t - hello.at) / 2.4;
    if (!calm() || u < 0 || u > 1) return { env: 0, arm: 0, armL: 0, rot: 0, brow: 0, bubble: 0 };
    const ramp = u < 0.1 ? smooth(u / 0.1) : u > 0.82 ? smooth((1 - u) / 0.18) : 1;
    const w = Math.sin((t - hello.at) * TAU * 3.3);
    return { env: ramp, arm: ramp * (78 + 24 * w), armL: ramp * 8, rot: ramp * (-3 + 1.2 * w), brow: ramp * 2.2, bubble: ramp };
  }

  // noodle arm: rotates about the shoulder and bends against its own motion; the mitt follows the tip
  function drawArm(side, sp, M) {
    const th = sp.x, v = sp.v;
    const rot = (x, y, a) => { const r = a * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r); return [x * c - y * sn, x * sn + y * c]; };
    let e = rot(-20, 33, th), c1 = rot(-12, 8, th), c2 = rot(-18, 20, th);
    const len = Math.hypot(e[0], e[1]) || 1, nx = -e[1] / len, ny = e[0] / len;
    const off = clamp(-v * 0.008, -6, 6) * M + Math.sin(armPh * 0.9 + (side === 'L' ? 0 : 1.7)) * 1.6 * M;
    c2 = [c2[0] + nx * off, c2[1] + ny * off]; c1 = [c1[0] + nx * off * 0.5, c1[1] + ny * off * 0.5]; e = [e[0] + nx * off * 0.4, e[1] + ny * off * 0.4];
    const f = n => n.toFixed(1);
    el['armPath' + side].setAttribute('d', `M31 90C${f(31 + c1[0])} ${f(90 + c1[1])} ${f(31 + c2[0])} ${f(90 + c2[1])} ${f(31 + e[0])} ${f(90 + e[1])}`);
    el['mitt' + side].setAttribute('transform', `translate(${(31 + e[0] - 11).toFixed(2)} ${(90 + e[1] - 123).toFixed(2)}) rotate(${(th * 0.9 + off * 1.4).toFixed(2)} 11 123)`);
  }

  function update(dt) {
    t += dt;
    const M = motionScale(), hk = clamp(M, 0.6, 1.2);
    const target = MOTION[mood], a = 1 - Math.exp(-dt / 0.35);
    for (const k of KEYS) cur[k] += (target[k] - cur[k]) * a;
    hover += (hoverTarget - hover) * (1 - Math.exp(-dt / 0.14));

    bobPh += TAU * cur.bobF * dt; swayPh += TAU * cur.swayF * dt; armPh += TAU * cur.armF * dt;

    // body: bob or bounce, squash and stretch, landing thud
    const bph = bobPh % TAU;
    if (bph < prevBph) s.settle.v += (6 + 26 * cur.bounce) * M;
    prevBph = bph;
    const smoothH = (1 - Math.cos(bph)) / 2, arcH = Math.abs(Math.sin(bph / 2));
    const h = smoothH + (arcH - smoothH) * cur.bounce;
    const tp = tapPose(M), hel = helloPose();
    spring(s.settle, 0, 260, 9, dt);
    let y = -cur.bobAmp * M * h + tp.y + s.settle.x * 0.1;
    let rot = Math.sin(swayPh) * cur.swayA * M + tp.tilt * 5 * M + s.popR.x;
    const jm = M > 0.35 ? 1 : 0;
    const x = Math.sin(swayPh * 0.5) * cur.swayA * 0.25 * M + noise(t * 3.1, 1) * cur.jit * jm * M;
    y += noise(t * 3.7, 5) * cur.jit * 0.6 * jm * M;
    rot += noise(t * 2.3, 9) * cur.jitRot * jm * M + hover * 2.6 * cursor.x * M + hel.rot * hk;
    y -= hover * 1.2 * M;
    const land = clamp(1 - h / 0.16, 0, 1) * cur.bounce;
    const sq = cur.sq * M * ((0.4 - h) + land * 0.9) + tp.sq * M + Math.sin(t * 1.9) * 0.006 + s.settle.x * 0.004;
    const pop = s.popS.x * 0.06;
    const sy = 1 - sq + pop, sx = 1 + sq * 0.85 + pop + hover * 0.035;
    vy += (((y - lastY) / Math.max(dt, 1e-3)) - vy) * clamp(dt * 18, 0, 1);
    lastY = y;
    el.body.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;

    // ground shadow shrinks as Tic lifts
    const lift = clamp(-y / 14, 0, 1.2);
    el.shadow.style.transform = `scale(${(1 - 0.3 * lift + (sx - 1) * 0.8).toFixed(3)},${(1 - 0.3 * lift).toFixed(3)})`;
    el.shadow.style.opacity = (0.2 * (1 - 0.6 * Math.min(lift, 1))).toFixed(3);

    // arms, legs, bell
    const drag = -vy * 0.16, wave = hover * (24 + 20 * Math.sin(t * TAU * 3.4));
    spring(s.armL, cur.armBase + Math.sin(armPh - 0.5) * cur.armAmp * M + drag + tp.arm * M + hel.armL * hk, 150, 9, dt);
    spring(s.armR, cur.armBase + Math.sin(armPh + 2.4) * cur.armAmp * M + drag + tp.arm * M + wave + hel.arm * hk, 150, 9, dt);
    spring(s.legL, Math.sin(armPh + 1.2) * cur.legAmp * M - rot * 0.5 - vy * 0.05, 110, 10, dt);
    spring(s.legR, -Math.sin(armPh + 1.2) * cur.legAmp * M + rot * 0.5 + vy * 0.05, 110, 10, dt);
    spring(s.bell, -rot * 1.5 - vy * 0.1, 90, 5, dt);
    spring(s.popS, 0, 190, 7.5, dt);
    spring(s.popR, 0, 160, 9, dt);
    drawArm('L', s.armL, M); drawArm('R', s.armR, M);
    el.legL.style.transform = `rotate(${s.legL.x.toFixed(2)}deg)`;
    el.legR.style.transform = `rotate(${s.legR.x.toFixed(2)}deg)`;
    el.bell.style.transform = `rotate(${s.bell.x.toFixed(2)}deg)`;

    // eyes: glances with a tiny wind-up, cursor gaze on hover, blinks
    if (lookSeq) {
      const st = lookSeq[0];
      gaze = { x: st.x * cur.eyeR * 1.4, y: st.y };
      if (t > st.until) { lookSeq.shift(); if (!lookSeq.length) { lookSeq = null; nextSaccade = t + 0.3; } }
    } else if (hover > 0.5) {
      gaze = { x: cursor.x * 4, y: cursor.y * 3.2 }; pend = null;
    } else if (t > nextSaccade) {
      const to = calm() && Math.random() < 0.4 ? { x: 0, y: 0.5 } : { x: rand(-1, 1) * cur.eyeR, y: rand(-0.7, 0.7) * cur.eyeR };
      gaze = { x: gaze.x - (to.x - gaze.x) * 0.14, y: gaze.y - (to.y - gaze.y) * 0.14 };
      pend = { to, at: t + 0.075 };
      nextSaccade = t + rand(cur.eyeMin, cur.eyeMax);
    }
    if (pend && t >= pend.at) { gaze = pend.to; pend = null; }
    spring(s.px, gaze.x, 700, 42, dt); spring(s.py, gaze.y, 700, 42, dt);
    const pxv = clamp(s.px.x, -4.2, 4.2), pyv = clamp(s.py.x, -5, 5);
    el.pupilL.style.transform = `translate(${pxv.toFixed(2)}px,${pyv.toFixed(2)}px)`;
    el.pupilR.style.transform = `translate(${(pxv * 0.94).toFixed(2)}px,${pyv.toFixed(2)}px)`;
    if (t > nextBlink) {
      blinkAt = t;
      if (!dbl && Math.random() < 0.2) { dbl = true; nextBlink = t + 0.26; } else { dbl = false; nextBlink = t + rand(cur.blkMin, cur.blkMax); }
    }
    const bt = t - blinkAt;
    const open = bt >= 0 && bt < 0.17 ? 1 - 0.94 * smooth(bt < 0.06 ? bt / 0.06 : bt < 0.08 ? 1 : 1 - (bt - 0.08) / 0.09) : 1;
    el.blinkL.style.transform = el.blinkR.style.transform = `scaleY(${open.toFixed(3)})`;

    // face sits slightly in front of the dial
    spring(s.faceX, gaze.x * 0.45 + rot * 0.15, 120, 14, dt);
    spring(s.faceY, gaze.y * 0.3 - vy * 0.012 + (sy - 1) * 6, 120, 14, dt);
    el.features.style.transform = `translate(${s.faceX.x.toFixed(2)}px,${s.faceY.x.toFixed(2)}px)`;

    // brows and mouth
    const bw = cur.browA * M, lift2 = -hover * 2.6 - hel.brow, rate = mood === 'good' ? 1.2 : 3.5;
    el.browL.style.transform = `translateY(${(Math.sin(t * rate + 1) * bw * 0.6 + noise(t, 4) * bw * 0.6 + lift2).toFixed(2)}px)`;
    el.browR.style.transform = `translateY(${(Math.sin(t * rate + 3) * bw * 0.7 + noise(t, 8) * bw * 0.6 + lift2).toFixed(2)}px)`;
    const mY = 1 + cur.mouthA * M * (h - 0.5) * 2 + hover * 0.08 + hel.env * 0.1, mX = 1 - (mY - 1) * 0.35;
    el.mouths.style.transform = `translate(${(noise(t * 2.2, 6) * cur.mouthQ * 0.8 * M).toFixed(2)}px,0) scale(${mX.toFixed(3)},${mY.toFixed(3)})`;

    // hello bubble
    el.hi.style.opacity = hel.bubble.toFixed(2);
    el.hi.style.transform = `scale(${(0.6 + 0.4 * hel.bubble).toFixed(3)})`;

    // idle gags (calm moods): a small hop or a look around
    if (t > gagAt) {
      gagAt = t + rand(7, 13);
      if (calm()) {
        if (Math.random() < 0.5) startTap(0.5);
        else lookSeq = [{ x: -1, y: -0.5, until: t + 0.5 }, { x: 1, y: -0.5, until: t + 1.1 }, { x: 0, y: 0.8, until: t + 1.5 }];
      }
    }
  }

  // wait for the boot screen to finish, then arm (mood changes start reacting) and wave hello
  function appVisible() {
    const content = document.querySelector('.content'), boot = document.getElementById('boot-overlay');
    return (!content || !content.classList.contains('boot-hidden')) && (!boot || boot.classList.contains('hidden'));
  }
  function frame(ts) {
    if (last === null) last = ts;
    const dt = clamp((ts - last) / 1000, 0, 1 / 20);
    last = ts;
    if (!armed && appVisible()) { armed = true; greetAt = t + 0.5; }
    if (greetAt !== null && t >= greetAt) { greetAt = null; sayHello(); }
    if (dt > 0) update(dt);
    requestAnimationFrame(frame);
  }

  panel.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') hoverTarget = 1; });
  panel.addEventListener('pointerleave', () => { hoverTarget = 0; });
  panel.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const r = svg.getBoundingClientRect();
    cursor.x = clamp((e.clientX - (r.left + r.width / 2)) / (r.width * 0.6), -1, 1);
    cursor.y = clamp((e.clientY - (r.top + r.height * 0.5)) / (r.height * 0.6), -1, 1);
  });
  panel.addEventListener('pointerdown', () => { startTap(1); nextBlink = t + 0.55; });
  requestAnimationFrame(frame);

  return {
    setMood(id) {
      if (!MOTION[id] || id === mood) return;
      const order = ['good', 'worried', 'stressed', 'meltdown', 'over'];
      const ni = order.indexOf(id), oi = order.indexOf(mood);
      const flinch = ni >= 1 && ni <= 3 && (oi < ni || oi >= 4);   // getting more "short" makes Tic flinch
      mood = id;
      if (!armed) return;                                          // no reaction while the app is still booting
      s.popS.v += flinch ? -7 : 8;
      s.popR.v += (Math.random() < 0.5 ? -1 : 1) * (flinch ? 90 : 50);
      if (!flinch) startTap(0.55);
      blinkAt = t;
    },
  };
})();

function updateMascot(diff) {
  const panel = document.getElementById('mascotPanel');
  const lineA = document.getElementById('mascotLineA');
  const lineB = document.getElementById('mascotLineB');
  if (!panel || !lineA || !lineB) return;

  const absDiff = Math.abs(diff);
  const mins = Math.round(absDiff * 60);
  let status = 'good';
  let text = ['TARGET LOCKED', 'WEEKLY DIFF IS STABLE'];

  if (diff < 0) {
    // falling behind: worried, then stressed, then meltdown
    if (absDiff >= 3) { status = 'meltdown'; text = ['SHORT 3+', `${mins} MIN SHORT`]; }
    else if (absDiff >= 2) { status = 'stressed'; text = ['SHORT 2+', `${mins} MIN SHORT`]; }
    else if (absDiff >= 1) { status = 'worried'; text = ['SHORT 1+', `${mins} MIN SHORT`]; }
  } else if (absDiff >= 1) {
    // ahead of target: pleased, not distressed
    status = 'over'; text = ['OVER TARGET', `${mins} MIN OVER`];
  }

  panel.classList.remove(
    'mascot-status-good',
    'mascot-status-worried',
    'mascot-status-stressed',
    'mascot-status-meltdown',
    'mascot-status-over'
  );
  panel.classList.add(`mascot-status-${status}`);
  lineA.textContent = text[0];
  lineB.textContent = text[1];
  ticMotion.setMood(status);
}

// ── SHARED HELPER: restore a day to normal (times visible, no holiday/pto/shutdown) ──
function clearDayOverride(i) {
  if (savedTimes[i]) {
    document.getElementById(`in-${i}`).value  = savedTimes[i].inV;
    document.getElementById(`out-${i}`).value = savedTimes[i].outV;
    delete savedTimes[i];
  }
  document.getElementById(`times-${i}`).style.display       = '';
  document.getElementById(`bottom-${i}`).style.display      = '';
  document.getElementById(`hol-display-${i}`).style.display = 'none';
  document.getElementById(`pto-display-${i}`).style.display = 'none';
  document.getElementById(`off-display-${i}`).style.display = 'none';
  document.getElementById(`away-block-${i}`).style.display  = '';
  document.getElementById(`card-${i}`).classList.remove('is-holiday', 'is-pto', 'is-off');
  setPressed(document.querySelector(`.hol-btn[data-day="${i}"]`), false);
  setPressed(document.querySelector(`.pto-btn[data-day="${i}"]`), false);
}

// a day is in exactly one mode: 'none' | 'hol' | 'pto' | 'off' (unpaid shutdown)
function dayMode(i) {
  const cl = document.getElementById(`card-${i}`).classList;
  return cl.contains('is-holiday') ? 'hol' : cl.contains('is-pto') ? 'pto' : cl.contains('is-off') ? 'off' : 'none';
}
function setDayMode(i, mode) {
  clearDayOverride(i);
  if (mode === 'none') return;
  savedTimes[i] = {
    inV:  document.getElementById(`in-${i}`).value,
    outV: document.getElementById(`out-${i}`).value,
  };
  document.getElementById(`times-${i}`).style.display      = 'none';
  document.getElementById(`bottom-${i}`).style.display     = 'none';
  document.getElementById(`away-block-${i}`).style.display = 'none';
  document.getElementById(`${mode}-display-${i}`).style.display = 'block';
  document.getElementById(`card-${i}`).classList.add({ hol: 'is-holiday', pto: 'is-pto', off: 'is-off' }[mode]);
  if (mode !== 'off') setPressed(document.querySelector(`.${mode}-btn[data-day="${i}"]`), true);
}

// ── HOLIDAY / PTO TOGGLE ──
// The planner is the source of truth: the buttons write to it, then the week re-syncs from it.
container.addEventListener('click', e => {
  const modeBtn = e.target.closest('.hol-btn, .pto-btn');
  if (modeBtn) {
    const i = parseInt(modeBtn.dataset.day, 10);
    const mode = modeBtn.classList.contains('hol-btn') ? 'hol' : 'pto';
    PTO.setMode(weekKeys()[i], modeBtn.classList.contains('active') ? 'none' : mode);
    syncFromPlanner();
    return;
  }

  // lunch button
  const lunchBtn = e.target.closest('.lunch-btn');
  if (lunchBtn) {
    const d = lunchBtn.dataset.day;
    document.querySelectorAll(`.lunch-btn[data-day="${d}"]`).forEach(b => setPressed(b, false));
    setPressed(lunchBtn, true);
    saveState(); update();
  }

  // away button toggle
  const awayBtn = e.target.closest('.away-btn');
  if (awayBtn) {
    const i = parseInt(awayBtn.dataset.day, 10);
    const turningOn = !awayBtn.classList.contains('active');
    setPressed(awayBtn, turningOn);
    const awayBlock = document.getElementById(`away-block-${i}`);
    awayBlock.classList.toggle('visible', turningOn);
    awayBlock.style.display = (turningOn && (isHolidayDay(i) || isPtoDay(i))) ? 'none' : '';
    saveState(); update(); return;
  }

  // away clear button
  const awayClr = e.target.closest('.away-clear');
  if (awayClr) {
    const i = parseInt(awayClr.dataset.day, 10);
    setPressed(document.querySelector(`.away-btn[data-day="${i}"]`), false);
    document.getElementById(`away-block-${i}`).classList.remove('visible');
    document.getElementById(`away-in-${i}`).value  = '';
    document.getElementById(`away-out-${i}`).value = '';
    saveState(); update(); return;
  }
});

// ── MAIN UPDATE ──
function update() {
  const wTarget = weeklyTarget();
  // show target — if it changed from base 40h, show the actual number
  const base40 = Math.abs(wTarget - 40) < 0.01;
  document.getElementById('target-display').textContent = base40 ? '40H' : wTarget.toFixed(2) + 'H';

  let total = 0;

  DAYS_CONFIG.forEach((day, i) => {
    const pill    = document.getElementById(`pill-${i}`);
    const eTarget = effectiveTarget(i);

    if (isHolidayDay(i)) {
      total += HOLIDAY_HOURS;
      pill.textContent = '8.00H';
      pill.className   = 'pill pill-hol';
      return;
    }
    if (isPtoDay(i)) {
      const ptoH = DAYS_CONFIG[i].baseTarget;
      total += ptoH;
      pill.textContent = ptoH.toFixed(2) + 'H';
      pill.className   = 'pill pill-pto';
      return;
    }

    if (isOffDay(i)) {
      pill.textContent = 'OFF';
      pill.className   = 'pill pill-off';
      return;
    }

    const inV  = document.getElementById(`in-${i}`).value;
    const outV = document.getElementById(`out-${i}`).value;
    if (!inV || !outV) { pill.innerHTML = '–'; pill.className = 'pill pill-none'; return; }

    const activeBtn = document.querySelector(`.lunch-btn.active[data-day="${i}"]`);
    const lunch     = activeBtn ? parseInt(activeBtn.dataset.val, 10) : day.defaultLunch;
    const awayMins  = isAwayDay(i) ? getAwayMins(i) : 0;
    const worked    = (roundQ(toMin(outV)) - roundQ(toMin(inV)) - lunch - awayMins) / 60;
    if (worked <= 0) { pill.innerHTML = 'ERR'; pill.className = 'pill pill-short'; return; }
    const credit = partialPto[i]; // part-day PTO planned for this date
    total += worked + credit;

    const delta = worked + credit - eTarget;
    pill.className = 'pill ' + (Math.abs(delta) < 0.01 ? 'pill-ok' : delta < 0 ? 'pill-short' : 'pill-over');
    const subs = [];
    if (awayMins > 0) subs.push(`-${(awayMins / 60).toFixed(2)}`);
    if (credit > 0)   subs.push(`<span class="pill-credit">+${credit.toFixed(2)} PTO</span>`);
    pill.innerHTML = subs.length
      ? `<span class="pill-inner"><span>${worked.toFixed(2)}H</span><span class="pill-sub">${subs.join(' ')}</span></span>`
      : worked.toFixed(2) + 'H';
  });

  const diff   = total - wTarget;
  const diffEl = document.getElementById('diff');
  const subEl  = document.getElementById('diff-sub');
  const advEl  = document.getElementById('advice');
  document.getElementById('total').textContent = total.toFixed(2) + 'H';

  if (Math.abs(diff) < 0.01) {
    diffEl.textContent = 'ON TARGET'; diffEl.className = 'metric-value good';
    subEl.textContent  = '';
    advEl.innerHTML    = '<span class="prompt">&gt; </span><span class="advice-text good">STATUS: TARGET REACHED. NOTHING TO MAKE UP.</span>';
  } else if (diff < 0) {
    const mins = Math.round(Math.abs(diff) * 60);
    diffEl.textContent = '-' + Math.abs(diff).toFixed(2) + 'H'; diffEl.className = 'metric-value bad-short';
    subEl.textContent  = mins + ' MIN SHORT';
    advEl.innerHTML    = `<span class="prompt">&gt; </span><span class="advice-text warn-short">MAKE UP ${mins} MIN (${Math.abs(diff).toFixed(2)}H). CLOCK IN EARLIER OR STAY LATER.</span>`;
  } else {
    const mins = Math.round(diff * 60);
    diffEl.textContent = '+' + diff.toFixed(2) + 'H'; diffEl.className = 'metric-value bad-over';
    subEl.textContent  = mins + ' MIN OVER';
    advEl.innerHTML    = `<span class="prompt">&gt; </span><span class="advice-text warn-over">WARNING: ${mins} MIN OVER TARGET. LEAVE EARLY TO COMPENSATE.</span>`;
  }

  updateMascot(diff);
  updateBanner();
}

// ── HOLIDAY BANNER ──
function updateBanner() {
  const banner = document.getElementById('holiday-banner');
  const lines  = [];

  for (let i = 0; i < 4; i++) {
    if (isHolidayDay(i)) {
      if (fridayIsHoliday()) {
        lines.push(`${DAYS_CONFIG[i].name} HOLIDAY ACTIVE — TARGET ADJUSTED TO 40H.`);
      } else {
        lines.push(`${DAYS_CONFIG[i].name} HOLIDAY ACTIVE — 8.00H CREDITED. WEEK IS 0.25H SHORT. MAKE UP TIME.`);
      }
    }
    if (isPtoDay(i)) {
      lines.push(`${DAYS_CONFIG[i].name} PTO ACTIVE — 8.25H CREDITED. WEEK ON TARGET.`);
    }
  }
  for (let i = 0; i < 5; i++) {
    if (isOffDay(i)) lines.push(`${DAYS_CONFIG[i].name} SHUTDOWN — UNPAID. TARGET REDUCED.`);
    if (partialPto[i] > 0) lines.push(`${DAYS_CONFIG[i].name} PLANNED PTO — ${partialPto[i].toFixed(2)}H CREDITED TO THIS DAY.`);
  }
  if (fridayIsHoliday()) {
    lines.push('FRIDAY HOLIDAY ACTIVE — LEAVE AT 17:00 MON–THU');
  }
  if (isPtoDay(4)) {
    lines.push('FRIDAY PTO ACTIVE — 7.00H CREDITED. WEEK ON TARGET.');
  }

  if (lines.length === 0) {
    banner.innerHTML = '';
    banner.classList.remove('active');
  } else {
    banner.innerHTML = lines.map(l => `<div class="banner-line">${l}</div>`).join('');
    banner.classList.add('active');
  }
}

// ── LOCAL STORAGE ──
function saveState() {
  try {
    const state = {
      weekStart: pendingRollover ? loadedWeek : weekKeys()[0],
      synced: true,
      days: DAYS_CONFIG.map((_, i) => ({
        inV:      document.getElementById(`in-${i}`).value,
        outV:     document.getElementById(`out-${i}`).value,
        lunch:    parseInt(document.querySelector(`.lunch-btn.active[data-day="${i}"]`)?.dataset.val || DAYS_CONFIG[i].defaultLunch, 10),
        holiday:  isHolidayDay(i),
        pto:      isPtoDay(i),
        away:     isAwayDay(i),
        awayIn:   document.getElementById(`away-in-${i}`).value  || null,
        awayOut:  document.getElementById(`away-out-${i}`).value || null,
        savedIn:  savedTimes[i]?.inV  || null,
        savedOut: savedTimes[i]?.outV || null,
      }))
    };
    store.set(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.warn('State save failed', e); }
}

function loadState() {
  try {
    const raw = store.get(STORAGE_KEY);
    if (!raw) return;
    const state = JSON.parse(raw);
    hadState = true; loadedWeek = state.weekStart || null; loadedSynced = !!state.synced;
    state.days.forEach((d, i) => {
      document.getElementById(`in-${i}`).value  = d.inV  || DAYS_CONFIG[i].defaultIn;
      document.getElementById(`out-${i}`).value = d.outV || DAYS_CONFIG[i].defaultOut;

      document.querySelectorAll(`.lunch-btn[data-day="${i}"]`).forEach(b => setPressed(b, false));
      const lb = document.querySelector(`.lunch-btn[data-day="${i}"][data-val="${d.lunch}"]`);
      setPressed(lb, true);

      // HOL/PTO come back from the planner (initWeek / syncFromPlanner); this only restores pre-planner flags
      setDayMode(i, d.holiday ? 'hol' : d.pto ? 'pto' : 'none');

      if (d.away) {
        const ab = document.querySelector(`.away-btn[data-day="${i}"]`);
        setPressed(ab, true);
        const awayBlock = document.getElementById(`away-block-${i}`);
        awayBlock.classList.add('visible');
        awayBlock.style.display = (d.holiday || d.pto) ? 'none' : '';
        if (d.awayIn)  document.getElementById(`away-in-${i}`).value  = d.awayIn;
        if (d.awayOut) document.getElementById(`away-out-${i}`).value = d.awayOut;
      }
    });
  } catch(e) { console.warn('State load failed', e); }
}

// ── BOOT SCREEN ──
const BOOT_KEY = 'timecard_boot_date';

const todayStr = () => localKey(new Date());
function shouldShowBoot() { return store.get(BOOT_KEY) !== todayStr(); }
function markBootShown()  { store.set(BOOT_KEY, todayStr()); }

function runDegauss(el) {
  el = el || document.querySelector('.content');
  el.classList.remove('degauss-anim');
  void el.offsetWidth; // restart animation if triggered again mid-run
  el.classList.add('degauss-anim');
  el.addEventListener('animationend', () => el.classList.remove('degauss-anim'), { once: true });
}

function runBootSequence(onComplete) {
  const overlay = document.getElementById('boot-overlay');
  const linesEl = document.getElementById('boot-lines');

  const lines = [
    { type: 'normal', text: 'TIMESYS BIOS v1.4 (C) 1987 .............<span class="ok">OK</span>' },
    { type: 'normal', text: 'CPU CHECK 8086 @ 4.77MHz .................<span class="ok">OK</span>' },
    { type: 'normal', text: 'MEMORY TEST 640K .........................<span class="ok">PASS</span>' },
    { type: 'normal', text: 'CLOCK SUBSYSTEM ..........................<span class="ok">OK</span>' },
    { type: 'normal', text: 'STORAGE MODULE ...........................<span class="ok">OK</span>' },
    { type: 'normal', text: 'PTO PLANNER MODULE .......................<span class="ok">OK</span>' },
    { type: 'normal', text: 'USER DATA FOUND ..........................<span class="ok">LOADED</span>' },
    { type: 'gap' },
    { type: 'title',  text: 'TIMECARD HELPER v3.0' },
    { type: 'ready',  text: '> SYSTEM READY' },
  ];
  const timings = [80, 220, 380, 530, 680, 800, 930, 1020, 1110, 1320];

  // cold power-on: raster snaps in as a bright line and unrolls (boot-tube-flash,
  // ~680ms via the overlay's own ::after), then the auto-degauss thunk fires as it
  // settles, and only once the picture is stable does POST text start printing —
  // matches how a real CRT wakes up before anything is legible on screen.
  const TEXT_OFFSET = 850;
  overlay.classList.remove('hidden');
  setTimeout(() => runDegauss(overlay), 480);

  lines.forEach((line, i) => {
    const el = document.createElement('div');
    if (line.type === 'gap') {
      el.style.height = '8px';
      el.className = 'boot-line visible';
    } else if (line.type === 'title') {
      el.className = 'boot-line-title';
      el.innerHTML = line.text;
    } else if (line.type === 'ready') {
      el.className = 'boot-line';
      el.innerHTML = `<span class="boot-ready">${line.text}</span><span class="boot-cursor"></span>`;
    } else {
      el.className = 'boot-line';
      el.innerHTML = line.text;
    }
    linesEl.appendChild(el);
    if (line.type !== 'gap') {
      setTimeout(() => el.classList.add('visible'), TEXT_OFFSET + timings[i]);
    }
  });

  // ── TRANSITION OUT ──
  setTimeout(() => {
    const screenEl  = document.querySelector('.screen');
    const contentEl = document.querySelector('.content');

    overlay.classList.add('booting-out');

    setTimeout(() => {
      overlay.classList.add('hidden');
      overlay.classList.remove('booting-out');

      screenEl.classList.add('blooming');

      // content fades in at 65% through bloom
      setTimeout(() => {
        contentEl.classList.remove('boot-hidden');
        contentEl.classList.add('boot-reveal');
      }, 585);

      // after bloom, run scanline pass
      setTimeout(() => {
        screenEl.classList.remove('blooming');
        contentEl.classList.remove('boot-reveal');

        const scanline = document.getElementById('boot-scanline');
        const screenH  = screenEl.offsetHeight;
        const duration = 1100;
        let startTime  = null;
        let rafHandle  = null;

        scanline.classList.add('sweeping');

        function animateScan(ts) {
          if (!startTime) startTime = ts;
          const elapsed  = ts - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased    = progress < 0.5
            ? 2 * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 2) / 2;

          scanline.style.top = (eased * (screenH + 32) - 32) + 'px';

          const distort = Math.sin(elapsed / 60) * 0.5 * Math.max(0, 1 - progress * 1.4);
          contentEl.style.transform = `skewX(${distort}deg)`;

          if (progress < 1) {
            rafHandle = requestAnimationFrame(animateScan);
          } else {
            rafHandle = null;
            scanline.classList.remove('sweeping');
            scanline.style.top = '';
            contentEl.style.transform = '';
            runDegauss();
            onComplete();
          }
        }
        rafHandle = requestAnimationFrame(animateScan);

      }, 910);

    }, 290);
  }, TEXT_OFFSET + 1750);
}

// ── WEEK + PLANNER SYNC ──
const TAB_KEY    = 'timecard_tab';
const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const partialPto = [0, 0, 0, 0, 0];   // part-day PTO hours per row, from the planner
let loadedWeek = null, hadState = false, loadedSynced = false, pendingRollover = false;

const pad2     = n => String(n).padStart(2, '0');
const localKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fmtKey   = k => { const [, m, d] = k.split('-').map(Number); return `${MONTH_ABBR[m - 1]} ${d}`; };

// the rows always show the current calendar week (Mon–Fri)
function weekKeys() {
  const now = new Date();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  return DAYS_CONFIG.map((_, i) => localKey(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i)));
}

function syncFromPlanner() {
  const keys = weekKeys(), today = localKey(new Date());
  keys.forEach((k, i) => {
    const m = PTO.getMode(k);
    partialPto[i] = m.mode === 'partial' ? m.hours : 0;
    const want = (m.mode === 'hol' || m.mode === 'pto' || m.mode === 'off') ? m.mode : 'none';
    if (dayMode(i) !== want) setDayMode(i, want);
    let label = fmtKey(k);
    if (m.name && (want !== 'none' || m.working)) label += ` · ${m.name.toUpperCase()}${m.working ? ' (WORKING)' : ''}`;
    document.getElementById(`date-${i}`).textContent = label;
    document.getElementById(`card-${i}`).classList.toggle('is-today', k === today);
  });
  document.getElementById('weekLabel').textContent = `WEEK OF ${fmtKey(keys[0])}`;
  saveState(); update();
}

function initWeek() {
  const keys = weekKeys();
  if (hadState && !loadedSynced) {
    // first run with the planner: carry over HOL/PTO already marked on the timecard
    keys.forEach((k, i) => {
      const m = dayMode(i);
      if ((m === 'hol' || m === 'pto') && PTO.getMode(k).mode === 'none') PTO.setMode(k, m);
    });
  }
  if (hadState && loadedWeek && loadedWeek !== keys[0]) offerRollover();
}

// true when no clock times, lunches or away blocks differ from the defaults
function weekIsPristine() {
  return DAYS_CONFIG.every((day, i) => {
    const lunch = document.querySelector(`.lunch-btn.active[data-day="${i}"]`)?.dataset.val;
    return document.getElementById(`in-${i}`).value  === day.defaultIn
        && document.getElementById(`out-${i}`).value === day.defaultOut
        && parseInt(lunch, 10) === day.defaultLunch
        && !isAwayDay(i);
  });
}

// ask before carrying last week's edited times into a new week (nothing to ask if they were never edited)
function offerRollover() {
  if (weekIsPristine()) return;
  pendingRollover = true;
  const prompt = document.getElementById('week-prompt');
  prompt.innerHTML = `<div class="wp-text">NEW WEEK DETECTED — TIMES ARE STILL FROM THE WEEK OF ${fmtKey(loadedWeek)}.</div>
    <div class="wp-btns"><button class="wp-btn" data-wp="roll">[ ROLL OVER ] RESET TIMES</button><button class="wp-btn keep" data-wp="keep">[ KEEP ] USE SAVED TIMES</button></div>`;
  prompt.classList.add('active');
}

// an app left open overnight (or over the weekend) must notice the new day / week
let shownWeek = weekKeys()[0], shownDay = localKey(new Date());
function checkClock() {
  const wk = weekKeys()[0], day = localKey(new Date());
  if (wk === shownWeek && day === shownDay) return;
  if (wk !== shownWeek && !pendingRollover) { loadedWeek = shownWeek; hadState = true; offerRollover(); }
  shownWeek = wk; shownDay = day;
  syncFromPlanner();
  if (!document.getElementById('view-pto').hidden) PTO.render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkClock(); });
window.addEventListener('focus', checkClock);
setInterval(checkClock, 60000);

document.getElementById('week-prompt').addEventListener('click', e => {
  const b = e.target.closest('[data-wp]');
  if (!b) return;
  pendingRollover = false;
  if (b.dataset.wp === 'roll') resetWeekData(); else saveState();
  e.currentTarget.classList.remove('active');
  e.currentTarget.innerHTML = '';
});

// ── TABS ──
function tabResync(el) {
  el.classList.remove('tab-resync');
  void el.offsetWidth;   // restart if switched again mid-effect
  el.classList.add('tab-resync');
  if (!el.dataset.rs) {   // one listener per panel
    el.dataset.rs = '1';
    el.addEventListener('animationend', e => { if (e.target === el) el.classList.remove('tab-resync'); });
  }
}
function showTab(name, animate = true) {
  const pto = name === 'pto';
  document.getElementById('view-timecard').hidden = pto;
  document.getElementById('view-pto').hidden      = !pto;
  document.getElementById('weekLabel').hidden     = pto;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  });
  if (pto) PTO.render(); else syncFromPlanner();
  try { store.set(TAB_KEY, name); } catch (e) {}
  if (animate) { window.scrollTo(0, 0); tabResync(document.getElementById(pto ? 'view-pto' : 'view-timecard')); }
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t && t.getAttribute('aria-selected') !== 'true') showTab(t.dataset.tab);
});
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const next = document.querySelector('.tab[aria-selected="false"]');
  showTab(next.dataset.tab);
  next.focus();
});

// ── INIT ──
applyTheme(store.get(THEME_KEY) || 'tan');
loadState();
initWeek();
document.querySelectorAll('input[type=time]').forEach(el =>
  el.addEventListener('change', () => { saveState(); update(); })
);
// first launch (no PTO numbers yet) or an incoming sync link opens the planner once
const SETUP_KEY = 'timecard_setup_seen';
let startTab = store.get(TAB_KEY) === 'pto' ? 'pto' : 'timecard';
if (PTO.hasIncoming() || (PTO.needsSetup() && !store.get(SETUP_KEY))) { startTab = 'pto'; store.set(SETUP_KEY, '1'); }
syncFromPlanner();   // the timecard is always computed, even when the planner tab is shown first
showTab(startTab, false);

if (shouldShowBoot()) {
  markBootShown();
  document.querySelector('.content').classList.add('boot-hidden');
  runBootSequence(() => {});
} else {
  runDegauss();
}

</script>
</body>
</html>
